server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer # W6: commerce-api로 복사돼 있어 client-id가 api와 같았다
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

# W6 (docs/week6/plan.md D-7): 구매 활동 consumer. DLT 이름은 기본 recoverer 규칙(원래 topic + .DLT)을 따른다.
kafka:
  topics:
    order-events: order-events
  groups:
    # group은 "이 용도로 어디까지 처리했나"(committed offset)를 갖는다. 다른 용도(예: 9주차 랭킹)는 새 group id를 쓴다 (D-7).
    purchase-activity: commerce-streamer.product-purchase-activity

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

---
spring:
  config:
    activate:
      on-profile: local, test

# api(8080·관리 8081)와 함께 로컬에서 띄울 수 있게 포트를 나눈다
server:
  port: 8085
management:
  server:
    port: 8086

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false