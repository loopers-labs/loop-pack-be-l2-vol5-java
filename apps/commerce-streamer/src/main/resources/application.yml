server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

order-events:
  topic: order-events

purchase-activity:
  group-id: purchase-activity
  concurrency: 1
  auto-startup: true

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      # 애플리케이션 재시작으로 완료 기록과 구매 활동이 지워지지 않게 유지한다.
      ddl-auto: update

server:
  port: 8082

management:
  server:
    port: 8083

---
spring.config.activate.on-profile: test

purchase-activity:
  fetch-min-bytes: 1
  fetch-max-wait-ms: 100
  poll-timeout-ms: 100

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
