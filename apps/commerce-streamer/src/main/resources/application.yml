server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

# 주문 확정 이벤트 소비 (6주차 설계 5). topic 은 인프라가 만듦 (D-90)
order-event:
  topic: order-events
  consumer-group: purchase-activity
  # 일시적 오류: pause 한 채 1s 부터 2배씩, 간격 최대 30s, 간격 합 5분 넘으면 중단. 실제 장애 실험 · 운영 failover 문헌값으로 확인 (D-87)
  retry:
    initial-interval: 1s
    multiplier: 2
    max-interval: 30s
    max-elapsed: 5m

# 쿠폰 접수 기록 적재 (8주차 D-132). topic 은 인프라가 만듦 (D-136)
coupon-issue:
  topic: coupon-issue-requests
  consumer-group: coupon-issue-request-loader
  max-poll-records: 500 # 묶음 적재 크기의 상한
  # 일시 오류는 상한 없이 pause 한 채 재시도한다. 적재를 멈추면 접수 약속이 DB 에 남지 않는다 (D-126 과 같은 기준)
  retry:
    initial-interval: 1s
    multiplier: 2
    max-interval: 30s
  # 발급 worker (D-171). 인스턴스당 동시 발급 = threads. 잠정값, 실험으로 확정
  worker:
    enabled: false # 로컬 · 운영은 실행 인자로 켬. 테스트는 회차를 직접 부름
    instance-id: streamer-1 # 인스턴스마다 다르게 둔다 (D-162)
    interval-ms: 200
    threads: 4
    batch-size: 10
    inner-retries: 2 # 일시 오류만 안쪽에서 다시 해 본다 (D-128)
    inner-backoff: 100ms
    redelivery-initial: 1s # 그다음은 지연 ZSET 으로 놓는다. 일시 오류는 상한 없음 (D-126, D-129)
    redelivery-max: 1m
    unclassified-limit: 3
    poison-deliveries: 10
    claim-min-idle: 30s # (연결 3s + 잠금 3s + Redis 1s) × (안쪽 재시도 + 1) + 여유 (D-131)
    recount-interval: 1s
    pending-confirm-after: 10s # api 접수 producer delivery-timeout(3s)보다 길게 (D-134)
  # Redis 유실 대응 (D-174, D-175). 잠정값
  recovery:
    interval-ms: 1000
    audit-interval: 60s
    audit-batch-size: 1000
  resend-producer: # 확인 대기 재전송. api 접수 producer 와 같은 잠정값 (D-134)
    request-timeout: 2s
    delivery-timeout: 3s
    send-timeout: 4s
    max-block: 500ms

# 응답 없는 DB 에서 listener 가 예외 없이 무기한 기다리면 재시도 · 상한이 동작하지 않아 드라이버에 상한을 둠 (6주차 D-98).
# 문장이 ms 단위라 정상 처리는 끊지 않음. 끊긴 COMMIT 의 결과가 모호해도 재전달을 멱등 처리로 흡수함. 공용 jpa.yml 이 아니라 앱마다 둬 batch 는 건드리지 않음
datasource:
  mysql-jpa:
    main:
      data-source-properties:
        socketTimeout: 10000
        # Hikari connection-timeout(3s)보다 오래 연결을 시도해도 기다리는 쪽이 없음
        connectTimeout: 3000

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false