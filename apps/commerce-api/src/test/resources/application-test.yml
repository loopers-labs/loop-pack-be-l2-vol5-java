# Disable transport to developer brokers, not W7 Outbox recording. W6 fixtures enable an owned broker explicitly.
commerce.order-events.enabled: false
commerce.outbox-relay.enabled: false
spring.kafka.bootstrap-servers: 127.0.0.1:1
# Monitoring HTTP tests enable their own sampler. Unrelated test contexts should not poll their databases.
commerce.payment-observation.enabled: false
