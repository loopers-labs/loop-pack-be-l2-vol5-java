server:
  address: 0.0.0.0
  port: 8080

management:
  server:
    address: 127.0.0.1
    port: 8081

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}
      roles: ADMIN
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:19092}
    admin:
      auto-create: false

datasource:
  mysql-jpa:
    main:
      jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
      username: ${MYSQL_USER}
      password: ${MYSQL_PWD}
  redis:
    master:
      host: ${REDIS_MASTER_HOST}
      port: ${REDIS_MASTER_PORT:6379}
    replicas: []

outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:false}
