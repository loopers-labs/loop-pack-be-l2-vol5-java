# local과 함께 사용하지 않는다. 보존 실험에서는 이 프로필만 명시한다.
management:
  server:
    port: 8082 # PG의 8081과 분리한다.

logging:
  config: classpath:logback-payment-lab.xml

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never

datasource:
  mysql-jpa:
    main:
      jdbc-url: jdbc:mysql://${COMMERCE_MYSQL_HOST:localhost}:${COMMERCE_MYSQL_PORT:3306}/loopers
      username: ${COMMERCE_MYSQL_USER:application}
      password: ${COMMERCE_MYSQL_PASSWORD:application}

datasource.redis:
  master:
    host: localhost
    port: 6379
  replicas:
    - host: localhost
      port: 6380
