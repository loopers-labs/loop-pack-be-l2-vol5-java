openapi: 3.0.3
info:
  title: Commerce API
  version: v1
  description: 브랜드, 상품, 좋아요, 포인트, 주문을 위한 HTTP API 계약
servers:
  - url: http://localhost:8080
tags:
  - name: Customer Brand
  - name: Customer Product
  - name: Like
  - name: Point
  - name: Customer Order
  - name: PG Callback
  - name: Admin Brand
  - name: Admin Product
  - name: Admin Order
paths:
  /api/v1/brands:
    get:
      tags: [Customer Brand]
      operationId: GetCustomerBrands
      summary: 고객 브랜드 목록 조회
      description: 삭제되지 않은 브랜드를 createdAt DESC, id ASC 순서로 반환한다. 캐시 hit에도 사용자 식별을 수행한다.
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 삭제 제외 브랜드 목록과 전체 개수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBrandPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'

  /api/v1/brands/{brandId}:
    get:
      tags: [Customer Brand]
      operationId: C01GetBrand
      summary: 브랜드 상세 조회
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: 브랜드 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBrandEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: BRAND_NOT_FOUND - 브랜드가 없거나 삭제됨
          x-error-codes: [BRAND_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/products:
    get:
      tags: [Customer Product]
      operationId: C02GetProducts
      summary: 상품 목록 조회
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/OptionalBrandId'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [latest, price_asc, likes_desc]
            default: latest
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 삭제되지 않은 상품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProductPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'

  /api/v1/products/{productId}:
    get:
      tags: [Customer Product]
      operationId: C03GetProduct
      summary: 상품 상세 조회
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 상품 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProductEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: PRODUCT_NOT_FOUND - 상품이 없거나 삭제됨
          x-error-codes: [PRODUCT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/products/{productId}/likes:
    post:
      tags: [Like]
      operationId: C04RegisterLike
      summary: 좋아요 등록
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '201':
          description: 좋아요를 처음 등록함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '200':
          description: 이미 등록된 좋아요이므로 상태를 유지함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: PRODUCT_NOT_FOUND - 상품이 없거나 삭제됨
          x-error-codes: [PRODUCT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Like]
      operationId: C05CancelLike
      summary: 좋아요 취소
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 좋아요가 없어도 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'

  /api/v1/users/{userId}/likes:
    get:
      tags: [Like]
      operationId: C06GetMyLikes
      summary: 내 좋아요 목록 조회
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 삭제된 상품을 제외한 좋아요 상품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikedProductPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: USER_NOT_FOUND - 경로 사용자가 요청자와 다름
          x-error-codes: [USER_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/points/charge:
    post:
      tags: [Point]
      operationId: C07ChargePoint
      summary: 포인트 충전
      security:
        - userId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '200':
          description: 충전 후 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEnvelope'
        '400':
          description: INVALID_REQUEST 또는 INVALID_CHARGE_AMOUNT
          x-error-codes: [INVALID_REQUEST, INVALID_CHARGE_AMOUNT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '409':
          description: POINT_BALANCE_LIMIT_EXCEEDED - 충전 후 잔액이 int64 범위를 넘음
          x-error-codes: [POINT_BALANCE_LIMIT_EXCEEDED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/points:
    get:
      tags: [Point]
      operationId: C08GetBalance
      summary: 내 포인트 잔액 조회
      security:
        - userId: []
      responses:
        '200':
          description: 현재 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEnvelope'
        '401':
          $ref: '#/components/responses/UserNotIdentified'

  /api/v1/orders:
    post:
      tags: [Customer Order]
      operationId: C09CreateOrder
      summary: 주문 생성
      security:
        - userId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: DRAFT 주문 상세. 품목과 합계를 담고 결제 전이므로 payment는 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailEnvelope'
        '400':
          description: INVALID_REQUEST, EMPTY_ORDER_ITEMS 또는 INVALID_ORDER_QUANTITY
          x-error-codes: [INVALID_REQUEST, EMPTY_ORDER_ITEMS, INVALID_ORDER_QUANTITY]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: PRODUCT_NOT_FOUND - 상품이 없거나 삭제됨
          x-error-codes: [PRODUCT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [Customer Order]
      operationId: C11GetMyOrders
      summary: 내 주문 목록 조회
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 주문 생성 최신순의 주문 요약 목록. CONFIRMED 항목에만 paymentAmount가 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'

  /api/v1/orders/{orderId}/confirm:
    post:
      tags: [Customer Order]
      operationId: C10ConfirmOrder
      summary: 주문 확정 — PG 결제 요청
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: 결제 성공을 반영한 CONFIRMED 주문 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailEnvelope'
        '202':
          description: PG 처리가 PENDING. 주문·결제 상태와 조회 경로 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPendingEnvelope'
        '400':
          description: INVALID_REQUEST
          x-error-codes: [INVALID_REQUEST]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: ORDER_NOT_FOUND
          x-error-codes: [ORDER_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: ORDER_ALREADY_CONFIRMED, PRODUCT_NOT_AVAILABLE, INSUFFICIENT_STOCK, INSUFFICIENT_POINT, PAYMENT_ALREADY_PROCESSED, POINT_CONFLICT
          x-error-codes: [ORDER_ALREADY_CONFIRMED, PRODUCT_NOT_AVAILABLE, INSUFFICIENT_STOCK, INSUFFICIENT_POINT, PAYMENT_ALREADY_PROCESSED, POINT_CONFLICT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: PAYMENT_FAILED
          x-error-codes: [PAYMENT_FAILED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 결제 결과를 확인하지 못해 동일한 취소 멱등키로 최대 3회 취소를 요청했다. 최종 취소 결과가 확인되지 않으면 결제 상태는 CANCEL_PROCESSING이다.
          x-error-codes: [PAYMENT_CANCELLATION_PENDING]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: INTERNAL_ERROR
          x-error-codes: [INTERNAL_ERROR]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/orders/{orderId}:
    get:
      tags: [Customer Order]
      operationId: C12GetMyOrder
      summary: 내 주문 상세 조회
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 주문 상세. 결제 시작 전 payment는 null이며 시작 후에는 결제 상태를 포함한다. 결제 실패 조회도 200이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: ORDER_NOT_FOUND - 주문이 없거나 다른 고객의 주문
          x-error-codes: [ORDER_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/orders/{orderId}/payment/reconcile:
    post:
      tags: [Customer Order]
      operationId: C13ReconcilePayment
      summary: 기존 PG 거래 결과 대사
      security:
        - userId: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 성공 또는 실패 결과 반영 완료. 결제 FAILED도 대사 완료이면 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResultEnvelope'
        '202':
          description: 처리 중 또는 조회 불가. 주문·결제 상태와 조회 경로 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcilePendingEnvelope'
        '400':
          description: INVALID_REQUEST
          x-error-codes: [INVALID_REQUEST]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/UserNotIdentified'
        '404':
          description: ORDER_NOT_FOUND
          x-error-codes: [ORDER_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/payments/callback:
    post:
      tags: [PG Callback]
      operationId: PaymentCallback
      summary: PG 결제 결과 알림
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallbackRequest'
      responses:
        '200':
          description: 권위 조회 결과 반영 완료 또는 동일 결과의 중복 알림
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackSuccessEnvelope'
        '202':
          description: PG 처리 중 또는 조회 불가로 결과 미확정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackPendingEnvelope'
        '400':
          description: INVALID_REQUEST
          x-error-codes: [INVALID_REQUEST]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: PAYMENT_ATTEMPT_NOT_FOUND
          x-error-codes: [PAYMENT_ATTEMPT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: PAYMENT_RESULT_CONFLICT
          x-error-codes: [PAYMENT_RESULT_CONFLICT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api-admin/v1/brands:
    get:
      tags: [Admin Brand]
      operationId: A01GetBrands
      security:
        - adminBasic: []
      summary: 관리자 브랜드 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 삭제된 브랜드를 포함한 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBrandPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'
    post:
      tags: [Admin Brand]
      operationId: A02CreateBrand
      security:
        - adminBasic: []
      summary: 브랜드 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
      responses:
        '201':
          description: 생성된 브랜드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBrandEnvelope'
        '400':
          description: INVALID_REQUEST 또는 INVALID_BRAND_NAME
          x-error-codes: [INVALID_REQUEST, INVALID_BRAND_NAME]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          description: DUPLICATE_BRAND_NAME
          x-error-codes: [DUPLICATE_BRAND_NAME]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api-admin/v1/brands/{brandId}:
    get:
      tags: [Admin Brand]
      operationId: A03GetBrand
      security:
        - adminBasic: []
      summary: 관리자 브랜드 상세 조회
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: 삭제된 브랜드를 포함한 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBrandEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: BRAND_NOT_FOUND - 존재한 적이 없는 브랜드
          x-error-codes: [BRAND_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Admin Brand]
      operationId: A04UpdateBrand
      security:
        - adminBasic: []
      summary: 브랜드 수정
      parameters:
        - $ref: '#/components/parameters/BrandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
      responses:
        '200':
          description: 수정된 브랜드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBrandEnvelope'
        '400':
          description: INVALID_REQUEST 또는 INVALID_BRAND_NAME
          x-error-codes: [INVALID_REQUEST, INVALID_BRAND_NAME]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: BRAND_NOT_FOUND - 브랜드가 없거나 삭제됨
          x-error-codes: [BRAND_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: DUPLICATE_BRAND_NAME
          x-error-codes: [DUPLICATE_BRAND_NAME]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Admin Brand]
      operationId: A05DeleteBrand
      security:
        - adminBasic: []
      summary: 브랜드 삭제
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: 브랜드와 연결된 미삭제 상품 전체를 함께 논리 삭제함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: BRAND_NOT_FOUND - 브랜드가 없거나 이미 삭제됨
          x-error-codes: [BRAND_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api-admin/v1/products:
    get:
      tags: [Admin Product]
      operationId: A06GetProducts
      security:
        - adminBasic: []
      summary: 관리자 상품 목록 조회
      parameters:
        - $ref: '#/components/parameters/OptionalBrandId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 삭제된 상품을 포함한 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'
    post:
      tags: [Admin Product]
      operationId: A07CreateProduct
      security:
        - adminBasic: []
      summary: 상품 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: 재고가 0인 새 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '400':
          description: INVALID_REQUEST, INVALID_PRODUCT_NAME 또는 INVALID_PRODUCT_PRICE
          x-error-codes: [INVALID_REQUEST, INVALID_PRODUCT_NAME, INVALID_PRODUCT_PRICE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: BRAND_NOT_FOUND - 브랜드가 없거나 삭제됨
          x-error-codes: [BRAND_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: DUPLICATE_PRODUCT_NAME
          x-error-codes: [DUPLICATE_PRODUCT_NAME]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api-admin/v1/products/{productId}:
    get:
      tags: [Admin Product]
      operationId: A08GetProduct
      security:
        - adminBasic: []
      summary: 관리자 상품 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 삭제된 상품을 포함한 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: PRODUCT_NOT_FOUND - 존재한 적이 없는 상품
          x-error-codes: [PRODUCT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Admin Product]
      operationId: A09UpdateProduct
      security:
        - adminBasic: []
      summary: 상품 수정
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: 수정된 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '400':
          description: INVALID_REQUEST, INVALID_PRODUCT_NAME 또는 INVALID_PRODUCT_PRICE
          x-error-codes: [INVALID_REQUEST, INVALID_PRODUCT_NAME, INVALID_PRODUCT_PRICE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: PRODUCT_NOT_FOUND - 상품이 없거나 삭제됨
          x-error-codes: [PRODUCT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: DUPLICATE_PRODUCT_NAME 또는 BRAND_CHANGE_NOT_ALLOWED
          x-error-codes: [DUPLICATE_PRODUCT_NAME, BRAND_CHANGE_NOT_ALLOWED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Admin Product]
      operationId: A10DeleteProduct
      security:
        - adminBasic: []
      summary: 상품 삭제
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: PRODUCT_NOT_FOUND - 상품이 없거나 이미 삭제됨
          x-error-codes: [PRODUCT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api-admin/v1/products/{productId}/stock:
    put:
      tags: [Admin Product]
      operationId: A11ChangeStock
      security:
        - adminBasic: []
      summary: 상품 재고 변경
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockRequest'
      responses:
        '200':
          description: 재고가 변경된 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductEnvelope'
        '400':
          description: INVALID_REQUEST 또는 INVALID_STOCK_QUANTITY
          x-error-codes: [INVALID_REQUEST, INVALID_STOCK_QUANTITY]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: PRODUCT_NOT_FOUND - 상품이 없거나 삭제됨
          x-error-codes: [PRODUCT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api-admin/v1/orders:
    get:
      tags: [Admin Order]
      operationId: A12GetOrders
      security:
        - adminBasic: []
      summary: 관리자 주문 목록 조회
      parameters:
        - name: buyerId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 주문 생성 최신순의 관리자 주문 요약 목록. CONFIRMED 항목에만 paymentAmount가 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderSummaryPageEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api-admin/v1/orders/{orderId}:
    get:
      tags: [Admin Order]
      operationId: A13GetOrder
      security:
        - adminBasic: []
      summary: 관리자 주문 상세 조회
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 구매자 식별자를 포함한 주문 상세. DRAFT에는 payment가 없고 CONFIRMED에는 결제액·시각이 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetailEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: ORDER_NOT_FOUND
          x-error-codes: [ORDER_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    adminBasic:
      type: http
      scheme: basic
      description: 관리자 모드. 로컬 실습 계정은 admin / admin이며 비밀번호는 LOCAL_ADMIN_PASSWORD로 변경할 수 있다.
    userId:
      type: apiKey
      in: header
      name: X-USER-ID
      description: 일반 사용자 모드. DB에 존재하는 사용자 ID를 입력한다.

  parameters:
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OptionalBrandId:
      name: brandId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    InvalidRequest:
      description: INVALID_REQUEST - 요청 형식이 올바르지 않음
      x-error-codes: [INVALID_REQUEST]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserNotIdentified:
      description: USER_NOT_IDENTIFIED - 요청자를 식별할 수 없음
      x-error-codes: [USER_NOT_IDENTIFIED]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AdminForbidden:
      description: ADMIN 역할이 없어 접근이 거절됨. 공통 응답 형식을 사용하지 않는다.

  schemas:
    PendingMetadata:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [PENDING]
        errorCode:
          nullable: true
          enum: [null]
        message:
          nullable: true
          enum: [null]
    ConfirmPaymentRequest:
      type: object
      required: [paymentKey, paymentAttemptKey]
      properties:
        paymentKey:
          type: string
          description: PG에서 발급되어 승인 요청에 사용하는 결제 키
        paymentAttemptKey:
          type: string
          description: 클라이언트가 생성하며 같은 요청의 재전송에 재사용하는 시도 키
    PaymentCallbackRequest:
      type: object
      required: [providerOrderId, transactionKey, status]
      description: 알림 본문만으로 확정하지 않고 고정 PG 조회에서 계정·주문·거래·금액을 검증한다.
      properties:
        providerOrderId:
          type: string
        transactionKey:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
    Payment:
      type: object
      nullable: true
      description: 결제 전에는 null이며 결제 시도 후에는 결제수단·상태·금액·결제 시각을 포함한다.
      required: [method, status, amount, paidAt]
      properties:
        method:
          type: string
          enum: [PG, POINT]
        status:
          type: string
          enum: [PENDING, UNKNOWN, SUCCESS, FAILED, CANCEL_PROCESSING, CANCELED]
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 결제 요청 금액. 이전 POINT 결제는 당시 결제액
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: 결제 성공 시각. 성공 전에는 null
    ReconcileResult:
      type: object
      required: [orderStatus, paymentStatus]
      properties:
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          type: string
          enum: [SUCCESS, FAILED]
      example:
        orderStatus: DRAFT
        paymentStatus: FAILED
    PaymentPendingResult:
      type: object
      required: [orderStatus, paymentStatus, statusUrl]
      properties:
        orderStatus:
          type: string
          enum: [DRAFT]
        paymentStatus:
          type: string
          enum: [PENDING, UNKNOWN]
        statusUrl:
          type: string
          description: 주문 상태 GET 조회 경로
          example: /api/v1/orders/42
      example:
        orderStatus: DRAFT
        paymentStatus: UNKNOWN
        statusUrl: /api/v1/orders/42
    ConfirmPendingResult:
      type: object
      required: [orderStatus, paymentStatus, statusUrl]
      properties:
        orderStatus:
          type: string
          enum: [DRAFT]
        paymentStatus:
          type: string
          enum: [PENDING]
        statusUrl:
          type: string
          description: 주문 상태 GET 조회 경로
          example: /api/v1/orders/42
      example:
        orderStatus: DRAFT
        paymentStatus: PENDING
        statusUrl: /api/v1/orders/42
    ConfirmPendingEnvelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/PendingMetadata'
        data:
          $ref: '#/components/schemas/ConfirmPendingResult'
    ReconcileResultEnvelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/SuccessMetadata'
        data:
          $ref: '#/components/schemas/ReconcileResult'
    ReconcilePendingEnvelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/PendingMetadata'
        data:
          $ref: '#/components/schemas/PaymentPendingResult'
    CallbackSuccessEnvelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/SuccessMetadata'
        data:
          nullable: true
          enum: [null]
    CallbackPendingEnvelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/PendingMetadata'
        data:
          nullable: true
          enum: [null]
    SuccessMetadata:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [SUCCESS]
      example:
        result: SUCCESS
    ErrorMetadata:
      type: object
      required: [result, errorCode, message]
      properties:
        result:
          type: string
          enum: [FAIL]
        errorCode:
          type: string
          description: api-contract.md의 오류 코드
          enum:
            - INVALID_REQUEST
            - INVALID_STOCK_QUANTITY
            - INVALID_POINT_BALANCE
            - INVALID_PRODUCT_NAME
            - INVALID_PRODUCT_PRICE
            - INVALID_BRAND_NAME
            - INVALID_CHARGE_AMOUNT
            - INVALID_ORDER_QUANTITY
            - EMPTY_ORDER_ITEMS
            - USER_NOT_IDENTIFIED
            - BRAND_NOT_FOUND
            - PRODUCT_NOT_FOUND
            - ORDER_NOT_FOUND
            - USER_NOT_FOUND
            - LIKE_NOT_FOUND
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - DUPLICATE_BRAND_NAME
            - DUPLICATE_PRODUCT_NAME
            - ORDER_ALREADY_CONFIRMED
            - BRAND_CHANGE_NOT_ALLOWED
            - PRODUCT_NOT_AVAILABLE
            - INSUFFICIENT_STOCK
            - INSUFFICIENT_POINT
            - POINT_CONFLICT
            - POINT_BALANCE_LIMIT_EXCEEDED
            - PAYMENT_FAILED
            - PAYMENT_CANCELLATION_PENDING
            - PAYMENT_ATTEMPT_NOT_FOUND
            - PAYMENT_RESULT_CONFLICT
            - INTERNAL_ERROR
        message:
          type: string
      example:
        result: FAIL
        errorCode: PRODUCT_NOT_FOUND
        message: 상품을 찾을 수 없습니다.
    SuccessEnvelope:
      type: object
      required: [meta]
      properties:
        meta:
          $ref: '#/components/schemas/SuccessMetadata'
    ErrorEnvelope:
      type: object
      required: [meta]
      properties:
        meta:
          $ref: '#/components/schemas/ErrorMetadata'

    BrandRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백을 제외한 브랜드 이름
      example:
        name: Nike
    CreateProductRequest:
      type: object
      required: [brandId, name, price]
      properties:
        brandId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백을 제외한 상품 이름
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
      example:
        brandId: 1
        name: 운동화
        price: 3000
    UpdateProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백을 제외한 상품 이름
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        brandId:
          type: integer
          format: int64
          description: 보내는 경우 현재 브랜드 ID와 같아야 한다.
      example:
        name: 새 운동화
        price: 3500
        brandId: 1
    StockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 0
          description: 변경 후 최종 재고 수량
      example:
        quantity: 10
    ChargeRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
      example:
        amount: 10000
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
      example:
        productId: 10
        quantity: 2

    CustomerBrand:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      example:
        id: 1
        name: Nike
    AdminBrand:
      type: object
      required: [id, name, deleted]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        deleted:
          type: boolean
      example:
        id: 1
        name: Nike
        deleted: false
    ProductBrand:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CustomerProduct:
      type: object
      required: [id, name, price, brand, likeCount, soldOut]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
          format: int64
        brand:
          $ref: '#/components/schemas/ProductBrand'
        likeCount:
          type: integer
          format: int64
          minimum: 0
        soldOut:
          type: boolean
      example:
        id: 10
        name: 운동화
        price: 3000
        brand:
          id: 1
          name: Nike
        likeCount: 3
        soldOut: false
    AdminProduct:
      type: object
      required: [id, name, price, brand, stock, deleted]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
          format: int64
        brand:
          $ref: '#/components/schemas/ProductBrand'
        stock:
          type: integer
          format: int32
          minimum: 0
        deleted:
          type: boolean
      example:
        id: 10
        name: 운동화
        price: 3000
        brand:
          id: 1
          name: Nike
        stock: 10
        deleted: false
    Balance:
      type: object
      required: [balance]
      properties:
        balance:
          type: integer
          format: int64
          minimum: 0
      example:
        balance: 10000
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, CANCELED]
    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPrice, amount]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
          description: 주문 생성 시점의 상품 이름
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: integer
          format: int64
          minimum: 1
          description: 주문 생성 시점의 상품 가격
        amount:
          type: integer
          format: int64
          minimum: 1
    LegacyPayment:
      type: object
      required: [amount, paidAt]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 확정에 성공해 실제 결제한 금액
        paidAt:
          type: string
          format: date-time
          description: 결제 시각
    OrderDetail:
      type: object
      required: [id, status, items, totalAmount, payment]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          minItems: 1
          description: 주문 당시 저장한 상품 정보와 수량·단가·품목 금액
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: integer
          format: int64
          minimum: 1
          description: 주문 품목 금액의 합계. DRAFT에도 존재함
        payment:
          $ref: '#/components/schemas/Payment'
    OrderSummary:
      type: object
      required: [id, status, itemCount, totalAmount]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        itemCount:
          type: integer
          format: int32
          minimum: 1
        totalAmount:
          type: integer
          format: int64
          minimum: 1
          description: 주문 품목 금액의 합계
        paymentAmount:
          type: integer
          format: int64
          minimum: 1
          description: CONFIRMED일 때만 존재하는 결제액. DRAFT에서는 생략함
    AdminOrderDetail:
      type: object
      required: [id, buyerId, status, items, totalAmount]
      properties:
        id:
          type: integer
          format: int64
        buyerId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          minItems: 1
          description: 주문 당시 저장한 상품 정보와 수량·단가·품목 금액
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: integer
          format: int64
          minimum: 1
          description: 주문 품목 금액의 합계. DRAFT에도 존재함
        payment:
          $ref: '#/components/schemas/Payment'
    AdminOrderSummary:
      type: object
      required: [id, buyerId, status, itemCount, totalAmount]
      properties:
        id:
          type: integer
          format: int64
        buyerId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        itemCount:
          type: integer
          format: int32
          minimum: 1
        totalAmount:
          type: integer
          format: int64
          minimum: 1
          description: 주문 품목 금액의 합계
        paymentAmount:
          type: integer
          format: int64
          minimum: 1
          description: CONFIRMED일 때만 존재하는 결제액. DRAFT에서는 생략함

    LikedProductPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustomerProduct'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
    CustomerProductPage:
      type: object
      required: [content, page, size, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustomerProduct'
