      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminProduct'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
