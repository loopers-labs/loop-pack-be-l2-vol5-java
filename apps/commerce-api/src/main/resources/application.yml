server:
  shutdown: graceful # 진행 중 HTTP 요청의 사건 등록·send 가 끝난 뒤 전용 producer 가 닫히게 한다(설계 2.11).
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s # 각 lifecycle phase 의 대기. producer close(15초)와 더한 앱 전체 종료 보장이 아니다.
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

datasource:
  redis:
    connect-timeout: 200ms # 초기값. 정상·장애 대기 실측으로 조정한다. HTTP 전체 상한이 아니다.
    command-timeout: 200ms

commerce:
  cache:
    product-detail:
      enabled: true # false 는 DB-only 비교 모드. 읽기·채움만 우회하고 commit 뒤 무효화는 유지한다.
      ttl: 5m # 저장할 때 정하는 고정 TTL. hit 에서 연장하지 않는다.
  order-events:
    topic: order-events # 테스트는 실행별 이름으로 바꾼다. 기본 topic 에 테스트 record 를 쓰지 않는다.
    physical-close-timeout-seconds: 15 # 정상 종료 때 미완료 전송을 기다리는 시간. 30초 전달 예산 전체를 주지 않는다.
    producer-properties: # 공통 spring.kafka.producer 위에 덮어쓰는 주문 발행 전용 초기값. 근거·한계는 설계 2.11
      "[acks]": all
      "[enable.idempotence]": true
      "[max.in.flight.requests.per.connection]": 5
      "[retry.backoff.ms]": 500
      "[retry.backoff.max.ms]": 1000
      "[max.block.ms]": 5000
      "[request.timeout.ms]": 20000
      "[delivery.timeout.ms]": 30000
      "[linger.ms]": 0
      "[spring.json.add.type.headers]": false
  pg:
    base-url: http://127.0.0.1:18080 # 로컬 PG 주소. 테스트는 fixture 의 임의 포트로 바꿔 주입한다.
    callback-url: http://127.0.0.1:8080/api/v1/payments/callback # 기동 때 한 번 바인딩. 고객 입력으로 바꾸지 않는다.
    account-id: '135135'
    max-connections: 10 # PG 전용 풀(총·경로별 동일). 생성·조회가 공유한다.
    pool-acquire-timeout: 200ms
    connect-timeout: 300ms
    read-timeout: 1s

resilience4j:
  circuitbreaker:
    configs:
      pgBase: # 초기 가설값. 근거·재검토 조건은 설계 2.9
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 800ms
        slowCallRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: false
        maxWaitDurationInHalfOpenState: 10s
    instances:
      pgCreate:
        baseConfig: pgBase
      pgLookup:
        baseConfig: pgBase

---
spring:
  config:
    activate:
      on-profile: local, test

server:
  address: 127.0.0.1 # 로컬 실습 전용. 외부에 공개하지 않는다.

---
spring:
  config:
    activate:
      on-profile: test

commerce:
  cache:
    product-detail:
      ttl: 10s # 만료·복구 검증용 시험 TTL

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false