server:
  # 로컬 실습용. 외부 인터페이스에 바인딩하지 않는다 — 인증이 없는 API 를 같은 망의 다른 기기가 부를 수 없게 한다.
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true # 실험(W5 8.5)에서 바쁜 워커 스레드 수(tomcat.threads.busy)를 보기 위해 켠다
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
      - pg.yml

coupon:
  issue:
    publish:
      ack-timeout: 500ms # PUB-002. 한 요청 스레드가 broker 확인을 기다리는 상한
      max-in-flight: 32 # PUB-004. 동시에 확인을 기다리는 요청 스레드의 상한. EXP-022 뒤 다시 정한다
    worker:
      concurrency: 4 # WRK-002. consumer 스레드 수. 1부의 knee 4 가 출발값이고 EXP-023 뒤 다시 정한다
      auto-startup: true # WRK-008. 끄면 접수는 받되 기록하지 않는다. EXP-023 이 끈 채 예약을 쌓는다
    reconcile:
      enabled: true # RCN-001. 캐시에 있는 캠페인마다 예약과 쿠폰을 대조해 빠진 메시지를 다시 보낸다
      interval: 10s # Q-14. 지난 실행의 최대 번호가 "한 주기는 지났다" 를 뜻한다

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test
  # 관리자 경로(/api-admin/**)를 실제로 호출하기 위한 로컬 전용 계정.
  # 비밀이 아니다 — 저장소에 그대로 들어가는 값이고, 이름으로 그 사실을 드러낸다.
  # 이 블록은 local·test 프로파일에만 있다. dev 아래로는 내려가지 않는다.
  security:
    user:
      name: admin
      password: local-only-not-a-secret
      roles: ADMIN

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: test

coupon:
  issue:
    publish:
      max-in-flight: 2
    worker:
      auto-startup: false # 요청 경로 테스트가 "아직 DB 에 없다" 를 단언한다. 워커 테스트만 전용 토픽으로 켠다
    reconcile:
      enabled: false # 대사 테스트가 직접 부른다
