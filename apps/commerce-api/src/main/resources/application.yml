server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

payment-provider:
  lookup-retry:
    max-attempts: 2
    wait-duration: 200ms
    total-timeout: 5s
  lookup-circuit:
    # 실측 운영값이 아닌, 상태 전이를 학습하기 위한 초깃값이다. PG GET 조회에만 적용한다.
    sliding-window-size: 10
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
    permitted-calls-in-half-open-state: 1

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      # 재실행해도 확정 주문과 confirmedAt을 보존한다.
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
