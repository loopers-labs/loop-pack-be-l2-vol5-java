server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

pg:
  base-url: http://localhost:8010
  callback-url: http://localhost:8080/api/v1/payments/callback
  connect-timeout: 1s
  read-timeout: 9s # 결제 요청. 고객이 결제창에서 기다리는 한계를 10초로 보고 그 안에서 끝낸다. 넘기면 실패 처리
  lookup-delay: 7s # 결제 요청 전송 시점부터 백업 거래 조회까지
  lookup-read-timeout: 2s # 거래 조회. 7초 + 2초로 결제 요청 timeout 과 같이 끝난다

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: test

pg:
  lookup-delay: 1h # 예약된 거래 조회가 뒤 테스트에 끼어들지 않게. 조회 예약은 PaymentLookupSchedulerIntegrationTest 가 짧은 지연으로 본다

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false