server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  task:
    scheduling:
      pool:
        size: 2 # 결제 조회와 Outbox relay 스케줄러가 서로의 긴 회차에 밀리지 않게 한다
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

# 설계 19절 [임시] 수치. 측정 후 조정한다.
datasource:
  redis:
    command-timeout: 1s # Redis 장애·지연 시 요청이 기다리는 상한 (Lettuce 기본 60초)

commerce:
  product-list-cache:
    ttl: 1m # 고객 상품 목록 캐시 TTL. 무효화 실패 시 낡은 값이 남는 최대 시간
  # 설계 27절. partition 수와 max-block은 [임시] 수치다.
  kafka:
    topics:
      order-events: order-events
      order-events-partitions: 3
      order-event-republish-requests: order-event-republish-requests
      order-event-republish-requests-partitions: 3
    groups:
      order-event-republish: commerce-api-republish
    producer:
      max-block: 2s # broker 장애 때 metadata 대기로 요청 스레드가 묶이는 상한 (Kafka 기본 60초)
      republish-timeout: 10s # 재발행 명령 처리에서 OrderConfirmed send 확인을 기다리는 상한
      delivery-timeout: 30s # producer가 한 건 전송을 포기하는 상한. relay send-timeout(35s)보다 짧아 broker 결과가 먼저 온다
  # 설계 29절. 쿠폰 수용 전용 Redis 연결의 명령 timeout(D135·D137). 공용 datasource.redis.command-timeout은 그대로 둔다.
  coupon:
    admission:
      redis-command-timeout: 500ms
      max-execution: 10s # 재개 확인 모드의 시간 기준(D140). 잠금 대기 3초 + 연결 대기 3초 + 여유
  # 설계 28절 2단계. 수치는 [임시]다. enabled는 이 인스턴스에서 relay 스케줄러를 띄울지 정한다(여러 인스턴스면 한 대만 true).
  outbox:
    relay:
      enabled: true
      fixed-delay: PT1S
      send-timeout: 35s # relay가 broker 확인을 기다리는 상한

# 설계 21절. PG 우선순위와 연결 설정. 타임아웃은 [임시] 수치이며 측정 후 조정한다.
payment:
  providers:
    priority:
      - test-pg
    test-pg:
      base-url: http://localhost:8082
      user-id: "135135" # 테스트 PG 제공자 계정
      callback-url: http://localhost:8080/api/v1/payments/callback
      connect-timeout: 1s
      read-timeout: 3s

  lookup:
    initial-delay: 2s
    multiplier: 2
    max-delay: 20s
    max-attempts: 12
    batch-size: 100
    circuit:
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      open-duration: 30s
      half-open-calls: 3
    scheduler:
      enabled: true
      fixed-delay: PT1S
  expiry:
    timeout: 2m # 설계 26절 [임시]. 결제 시작 후 이 시간이 지나도 결과 미확정이면 결제 만료·재고 반환

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
# 로컬에서 쿠폰 발급을 해 볼 캠페인을 준비한다(29절). ddl-auto create로 테이블이 생긴 뒤 실행되도록 초기화를 미룬다. test 프로필에는 두지 않는다.
spring:
  config:
    activate:
      on-profile: local
  sql:
    init:
      mode: always
      data-locations:
        - classpath:sql/local/seed-coupon-campaign.sql
        - classpath:sql/local/seed-coupon-admission-settings.sql
  jpa:
    defer-datasource-initialization: true

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: test
payment:
  lookup:
    scheduler:
      enabled: false
commerce:
  outbox:
    relay:
      enabled: false
