server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
      - optional:classpath:application-secret.yml # PG 테스트 키(.gitignore). 견본은 application-secret.yml.example

# W3 ADR-W3-04: 잠금 대기 상한. MySQL은 쿼리별 대기 시간 문법이 없어 커넥션마다 세션 변수로 둔다.
# 넘기면 ERROR 1205 → CONCURRENCY_CONFLICT(409)로 응답한다. 확정 트랜잭션은 수십 ms라 3초는 붐빔의 신호다.
datasource:
  mysql-jpa:
    main:
      connection-init-sql: "SET SESSION innodb_lock_wait_timeout = 3"

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

# W5 로컬 테스트 PG (plan.md 7장). base URL·callback URL은 로컬 설정에서만 온다. user-id는 과제 지정 가상 계정.
# timeout (plan.md 6장 🔧): 생성은 읽기 3s·재시도 없음, 조회는 읽기 1s·재시도 있음.
pg:
  local:
    base-url: http://localhost:8082
    user-id: "135135"
    callback-url: http://localhost:8080/api/v1/payments/callback
    connect-timeout: 1s
    create-read-timeout: 3s
    lookup-read-timeout: 1s

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false