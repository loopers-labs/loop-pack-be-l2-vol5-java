server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

order-event:
  topic: order-events # 주문 확정 이벤트를 보내는 topic

product:
  list-cache:
    ttl: 60s # 무효화가 실패했을 때 낡은 목록이 남는 상한

payment:
  pg: # 로컬 테스트 PG 계약. 실제 PG 가 아니며 127.0.0.1 밖의 주소는 거절한다
    base-url: http://127.0.0.1:8082
    callback-url: http://127.0.0.1:8080/api/v1/payments/callback
    user-id: "135135" # 합성 제공자 계정. 내부 고객 인증을 대신하지 않는다
    connect-timeout: 1s
    create-read-timeout: 3s # 응답 헤더를 기다리는 시간. 넘으면 결과 미확인(UNKNOWN)이다
    lookup-read-timeout: 1s

# PG 거래 조회에만 적용한다. 결제 생성은 다시 실행하면 거래가 또 생길 수 있어 재시도·회로를 걸지 않는다.
# 적용 순서는 기본값(Retry 가 바깥)이라 재시도 한 번이 회로 표본 한 건으로 센다.
resilience4j:
  retry:
    instances:
      pgLookup:
        max-attempts: 3 # 최초 1회 + 재시도 2회. 조회 1회 최대 1초 x 3 + 대기 300ms
        wait-duration: 100ms
        enable-exponential-backoff: true # 100ms, 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.loopers.infrastructure.payment.PgStatusLookupFailedException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException # 회로가 막은 호출을 다시 두드리지 않는다
  circuitbreaker:
    instances:
      pgLookup:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions: # 404·빈 목록 같은 정상 응답은 예외가 아니므로 표본의 실패로 세지 않는다
          - com.loopers.infrastructure.payment.PgStatusLookupFailedException

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false