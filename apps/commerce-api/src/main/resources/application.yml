server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

datasource:
  mysql-jpa:
    main:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=3

commerce:
  test-pg:
    # Customer confirm uses this local PG when enabled; no PG server is started here.
    # Disabled PG rejects new payment and external recovery with 503; saved terminal reads remain available.
    enabled: false
    base-url: http://127.0.0.1:9090
    callback-url: http://127.0.0.1:8080/api/v1/payments/callback
    connect-timeout: 3s
    pool-timeout: 1s
    create-response-timeout: 60s
    lookup-response-timeout: 5s
    create-total-timeout: 65s
    lookup-total-timeout: 10s
  product-list-cache:
    enabled: true
    namespace: commerce:${spring.profiles.active:local}:products:v1
    ttl: 60s
    connect-timeout: 100ms
    command-timeout: 100ms
    single-flight-enabled: true
    single-flight-wait-millis: 500
    single-flight-max-in-flight: 64

logging:
  level:
    # HTTP wire DEBUG would expose the synthetic card body. Never enable it for payment traffic.
    org.apache.hc.client5.http.wire: "OFF"

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring.config.activate.on-profile: local, test
commerce.product-list-cache.enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
