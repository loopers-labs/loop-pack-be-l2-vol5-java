server:
  address: 127.0.0.1 # 로컬 실습 전용. 외부에서 접속하지 못하게 한다.
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - kafka.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml

payment:
  resilience:
    bulkhead:
      max-concurrent-calls: ${PAYMENT_BULKHEAD_MAX_CONCURRENT_CALLS:150}
    circuit-breaker:
      sliding-window-seconds: ${PAYMENT_CB_SLIDING_WINDOW_SECONDS:30}
      minimum-number-of-calls: ${PAYMENT_CB_MINIMUM_CALLS:20}
      failure-rate-threshold: ${PAYMENT_CB_FAILURE_RATE_THRESHOLD:70}
      wait-duration-in-open-state: ${PAYMENT_CB_OPEN_DURATION:30s}
      permitted-number-of-calls-in-half-open-state: ${PAYMENT_CB_HALF_OPEN_CALLS:2}

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: local
  security:
    user:
      name: admin
      password: ${LOCAL_ADMIN_PASSWORD:admin}
      roles: ADMIN

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
