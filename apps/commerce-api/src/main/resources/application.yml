server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
    mbeanregistry:
      enabled: true # tomcat_threads_busy/current/config_max 지표를 내보낸다 (W8 부하 테스트 모니터링)
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

pg:
  base-url: http://localhost:8010
  callback-url: http://localhost:8080/api/v1/payments/callback
  connect-timeout: 1s
  read-timeout: 8s # 결제 요청. 요청 전송부터 본문 수신까지의 마감. 고객이 결제창에서 기다리는 한계(10초) 안에서 끝낸다. 넘기면 실패 처리
  lookup-delay: 6s # 결제 요청 전송 시점부터 백업 거래 조회까지
  lookup-read-timeout: 2s # 거래 조회. 6초 + 2초로 결제 요청 timeout 과 같이 끝난다
  payment-expiry: 9s # 결제 시작부터. 지나도 결제 대기면 정리 job 이 FAILED. 결제 요청·거래 조회(8초)가 끝난 뒤라 서로 겹치지 않는다
  payment-expiry-interval: 1s # 정리 job 주기
  payment-expiry-batch-size: 100 # 정리 job 한 번에 처리하는 최대 주문 수
  bulkhead:
    max-concurrent-calls: 40 # 결제 요청을 동시에 기다리는 워커 스레드 수 (Tomcat 200 중). 넘으면 기다리지 않고 거절
  circuit-breaker:
    sliding-window-size: 20 # 최근 결제 요청 20건
    minimum-number-of-calls: 10 # 10건이 쌓이기 전에는 열지 않는다
    failure-rate-threshold: 50 # ERROR·NOT_SENT·UNKNOWN 비율(%)
    slow-call-duration-threshold: 3s
    slow-call-rate-threshold: 50 # 3초 넘은 호출 비율(%)
    wait-duration-in-open-state: 10s
    permitted-number-of-calls-in-half-open-state: 3

coupon-issue:
  limiter: # 쿠폰 발급 TX(CouponIssueProcessor.issue) 동시 실행 제한. 도착 순서대로 주는 Redis fair 세마포어, 프로모션마다 따로 센다 (DR-62)
    permits: 200 # 프로모션 하나의 동시 발급 TX 수 (앱 전체 합). 앱 3대 × 커넥션 풀 100 = 300 보다 작게
    lease: 2s # 허가 보유 상한. 지나면 반납하지 않아도 다음 획득·반납 때 회수된다
    wait-time: 600ms # 대기열에서 기다리는 상한. 그 안에 차례가 오지 않으면 재시도 없이 503 COUPON_ISSUE_BUSY

kafka:
  topics:
    order-events: # 주문 이벤트 (OrderConfirmed). key = orderId 문자열. commerce-api 가 만들고 쓴다
      name: order-events
      partitions: 3 # 같은 group 에서 최대 3개 consumer 가 나눠 읽을 여유. 늘리면 key → partition 매핑이 바뀐다
      replicas: 1 # 로컬 단일 broker

outbox:
  relay: # 주문 이벤트 Outbox relay. 한 relay 만 돈다: enabled 는 인스턴스 하나에서만 true (프로세스 사이 소유권은 보장하지 않는다)
    enabled: true
    interval: 1s # 회차가 끝난 뒤 다음 회차까지
    batch-size: 20 # 한 회차에 고르는 최대 행 수. 한 건씩 보낸다
    send-timeout: 35s # broker 확인 대기. producer delivery.timeout.ms(30s) 보다 길게 둬 producer 가 먼저 결론낸다
    retry-backoff: 1s # 첫 실패 뒤 재시도 간격, 연속 실패마다 두 배
    max-retry-backoff: 60s
    max-failures: 3 # 연속 실패(예외·대기 초과 구분 없음) 3회면 BLOCKED. eventId 로 재개해야 다시 보낸다

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: test

pg:
  lookup-delay: 1h # 예약된 거래 조회가 뒤 테스트에 끼어들지 않게. 조회 예약은 PaymentLookupSchedulerIntegrationTest 가 짧은 지연으로 본다
  payment-expiry-interval: 1h # 정리 job 이 테스트의 결제 대기 주문을 거두지 않게. job 은 PaymentExpiryJobIntegrationTest 가 짧은 주기로 본다
  circuit-breaker: # 컨텍스트를 같이 쓰는 테스트들의 실패 결과가 쌓여 서킷이 열리지 않게. 서킷은 PaymentRequestGuardTest 가 본다
    sliding-window-size: 10000
    minimum-number-of-calls: 10000

outbox:
  relay:
    enabled: false # 주기 relay 가 테스트의 Outbox 행을 먼저 보내지 않게. 테스트는 OrderEventRelay 를 직접 부른다
    send-timeout: 2s # 대기 초과 실험이 오래 걸리지 않게

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false