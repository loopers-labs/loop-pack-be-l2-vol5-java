server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

# 응답 없는 DB에서 스레드·커넥션이 무한정 묶이지 않게 MySQL 드라이버가 포기하는 시간 (기본: 무한).
# 공통 jpa.yml이 아니라 앱마다 둬서 긴 작업이 있는 batch에는 적용하지 않는다.
datasource:
  mysql-jpa:
    main:
      data-source-properties:
        connectTimeout: 3000 # 연결 맺기 (Hikari connection-timeout과 같은 3초)
        socketTimeout: 10000 # 쿼리 응답 대기. 이 앱의 조회·저장·짧은 락 대기보다 충분히 길게 둔다
  redis:
    # 명령 하나의 응답을 기다리는 최대 시간. 이 시간 안에 쿠폰 발급 판단을 확인하지 못하면 신규 발급은 503으로 답한다.
    # 공통 redis.yml이 아니라 앱에 둬서 다른 앱의 Redis 연결에는 적용하지 않는다.
    command-timeout: 200ms

commerce:
  coupon:
    # 현재 비교 범위는 DB 직접 발급과 Redis 수량·중복 판단 후 DB 동기 발급이다.
    issue-mode: REDIS_SYNC # DB_ONLY: Redis 판단 없이 DB TX. QUEUE: Redis 판단 + 작업 큐 등록 뒤 202, DB 저장은 Worker.
    issue-gate:
      # REDIS: 서버들이 함께 보는 Redis에 판단 정보를 둔다. LOCAL: 이 앱의 메모리에 둔다(서버 한 대 비교용 실험 설정).
      store: REDIS
      retention-after-end: 1h # 행사 종료 뒤 판단 정보를 남겨 둘 시간. 실행 자리를 뜻하지 않는다.
    issue-queue:
      # issue-mode=QUEUE일 때만 쓴다. Worker는 이 앱 안의 스케줄 스레드 하나다.
      consumer: worker-1 # 작업 큐 소비자 이름. 이 이름으로 처리 완료 전 작업을 다시 받는다.
      worker:
        enabled: true
        batch-size: 10 # 한 번에 가져올 작업 수
        save-in-batch: true # 가져온 작업을 한 DB TX로 저장한다. false면 한 건씩 TX다(비교용)
        max-attempts: 5 # 연결 장애가 아닌 실패가 한 작업에서 이만큼 쌓이면 보류함으로 옮긴다
        backoff-initial: 100ms # 연결 장애 뒤 Worker가 쉬는 시간. 이어지면 두 배씩 늘린다
        backoff-max: 30s
        fixed-delay-ms: 50 # 처리할 작업이 없을 때 다음 확인까지 기다리는 시간
      # 판단 정보 보존 시간(행사 종료 뒤). 남은 작업이 다 처리되면 Worker가 먼저 지운다. 작업 큐 자체에는 만료가 없다.
      retention-after-end: 7d
    closed-cache:
      # 다시 풀리지 않는 마감(남은 수 0이고 저장 전 예약도 0인 매진, 행사 종료)을 서버 메모리에 기억해 Redis에 가지 않는다.
      enabled: true
      ttl: 10s # 기억 시간. 다른 서버가 다시 준비한 캠페인을 이 시간 안에 다시 확인한다
    issue-limit:
      # DB 발급 TX 앞에서 기다리게 하는 비교 실험. NONE(기본) / LOCK(Redisson 분산락, 1개) / SEMAPHORE(Redisson 세마포어, permits개).
      mode: NONE
      permits: 3
      # 자리를 기다리는 최대 시간. 넘으면 Redis 예약을 돌리고 429다. 0s면 기다리지 않고 바로 거절한다.
      wait-timeout: 60s
  order-events:
    enabled: false
    topic: order-events
    relay:
      scheduling-enabled: false # 인스턴스 하나에서만 켠다
      # 처리 한계 ≈ batch-size / (fixed-delay + batch-size × 행당 처리 시간). docs/week7/outbox-experiments.md 실험 3
      fixed-delay-ms: 10000
      batch-size: 200
      send-wait: 130s # producer 기본 delivery.timeout.ms(120초)보다 길게 둔다
      first-retry: 2s
      max-retry: 60s
  payment:
    pg:
      base-url: http://127.0.0.1:18080
      callback-url: http://127.0.0.1:8080/api/v1/payments/callback
      connect-timeout: 300ms
      read-timeout: 1s
      lookup-read-timeout: 500ms
      lookup-budget: 2s
      # 조회 retry·회로. 동작 학습용 임시값이며 운영값이 아니다(ADR 0031).
      lookup-retry:
        max-attempts: 3
        first-wait: 100ms
        wait-multiplier: 2.0
      lookup-circuit:
        window-size: 4
        minimum-calls: 4
        failure-rate-threshold: 50
        open-wait: 10s
        half-open-calls: 2

---
# import한 kafka.yml이 이 파일의 첫 문서보다 우선하므로, 덮어쓰는 값은 뒤 문서에 둔다.
spring:
  kafka:
    producer:
      # Outbox에 저장한 JSON 문자열을 그대로 보낸다. 공통 JsonSerializer는 문자열을 한 번 더 따옴표로 감싼다.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring.config.activate.on-profile: benchmark

server:
  port: 8082

management:
  server:
    port: 8083

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false

---
spring.config.activate.on-profile: local, benchmark

commerce:
  cache:
    price:
      enabled: true
      ttl-seconds: 300
    popular:
      enabled: true
      ttl-seconds: 60

---
spring.config.activate.on-profile: local

commerce.cache.price.prefix: commerce:price-page:v3:local
commerce.cache.popular.prefix: commerce:popular-page:v1:local
# 로컬 3대 클러스터의 order-events(compose init이 생성)로 주문 확정 이벤트를 보낸다.
commerce.order-events.enabled: true
commerce.order-events.relay.scheduling-enabled: true

---
spring.config.activate.on-profile: benchmark

commerce.cache.price.prefix: commerce:price-page:v3:benchmark
commerce.cache.popular.prefix: commerce:popular-page:v1:benchmark
