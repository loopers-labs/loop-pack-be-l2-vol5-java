server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

# Redis 장애 시 요청이 오래 묶이지 않도록 연결·명령 대기를 제한하고, 실패하면 DB로 우회한다.
datasource:
  redis:
    connect-timeout: 100ms
    command-timeout: 100ms

# 기동 시 정렬별 전체·활성 브랜드 목록의 첫 페이지를 캐시에 채운다.
product:
  list-cache:
    warm-up:
      enabled: true

# 로컬 테스트 PG 연동. 기본 연결 1초, 응답 3초이며 test 응답은 1초다.
# 로컬 테스트 PG는 Commerce 관리 포트(8081)와 겹치지 않게 8082에서 실행한다.
payment:
  pg:
    base-url: http://127.0.0.1:8082
    callback-url: http://127.0.0.1:8080/api/v1/payments/callback
    provider-account-id: "135135"
    connect-timeout: 1s
    read-timeout: 3s
  # 미종결 시도를 마지막 변경 뒤 1분이 지나면 생성 후 24시간 동안 다시 조회한다.
  periodic-check:
    enabled: true
    interval: 1m
    idle-threshold: 1m
    batch-size: 100
    lookup-window: 24h

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: test

# 테스트 컨텍스트가 빈 DB로 목록 캐시를 채워 다른 테스트에 남기지 않도록 끈다.
product:
  list-cache:
    warm-up:
      enabled: false

# 테스트 PG의 응답 유실 시나리오(3초 지연)보다 짧게 두어 UNKNOWN을 관찰한다.
# 주기 조회는 끄고 테스트가 서비스를 직접 호출한다.
payment:
  pg:
    read-timeout: 1s
  periodic-check:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
