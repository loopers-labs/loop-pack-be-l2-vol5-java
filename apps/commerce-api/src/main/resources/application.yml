server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

# 응답 없는 DB에서 스레드·커넥션이 무한정 묶이지 않게 MySQL 드라이버가 포기하는 시간 (기본: 무한).
# 공통 jpa.yml이 아니라 앱마다 둬서 긴 작업이 있는 batch에는 적용하지 않는다.
datasource:
  mysql-jpa:
    main:
      data-source-properties:
        connectTimeout: 3000 # 연결 맺기 (Hikari connection-timeout과 같은 3초)
        socketTimeout: 10000 # 쿼리 응답 대기. 이 앱의 조회·저장·짧은 락 대기보다 충분히 길게 둔다

commerce:
  order-events:
    enabled: false
    topic: order-events
  payment:
    pg:
      base-url: http://127.0.0.1:18080
      callback-url: http://127.0.0.1:8080/api/v1/payments/callback
      connect-timeout: 300ms
      read-timeout: 1s
      lookup-read-timeout: 500ms
      lookup-budget: 2s
      # 조회 retry·회로. 동작 학습용 임시값이며 운영값이 아니다(ADR 0031).
      lookup-retry:
        max-attempts: 3
        first-wait: 100ms
        wait-multiplier: 2.0
      lookup-circuit:
        window-size: 4
        minimum-calls: 4
        failure-rate-threshold: 50
        open-wait: 10s
        half-open-calls: 2

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring.config.activate.on-profile: benchmark

server:
  port: 8082

management:
  server:
    port: 8083

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false

---
spring.config.activate.on-profile: local, benchmark

commerce:
  cache:
    price:
      enabled: true
      ttl-seconds: 300
    popular:
      enabled: true
      ttl-seconds: 60

---
spring.config.activate.on-profile: local

commerce.cache.price.prefix: commerce:price-page:v3:local
commerce.cache.popular.prefix: commerce:popular-page:v1:local
# 로컬 3대 클러스터의 order-events(compose init이 생성)로 주문 확정 이벤트를 보낸다.
commerce.order-events.enabled: true

---
spring.config.activate.on-profile: benchmark

commerce.cache.price.prefix: commerce:price-page:v3:benchmark
commerce.cache.popular.prefix: commerce:popular-page:v1:benchmark
