server:
  address: 127.0.0.1
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
      - optional:classpath:application-secret.yml # PG 테스트 키(.gitignore). 견본은 application-secret.yml.example
  # W7 D-1: 실패는 빨리 난다. 기본 120s → 30s. Kafka 규칙상 linger.ms + request.timeout.ms(20s) 이상이어야 한다.
  # 공용 modules/kafka/kafka.yml은 streamer도 쓰므로 commerce-api에서만 덮어쓴다 (kafka.yml에 이 키가 없어 import가 덮지 않는다).
  kafka:
    producer:
      properties:
        delivery.timeout.ms: 30000

# W3 ADR-W3-04: 잠금 대기 상한. MySQL은 쿼리별 대기 시간 문법이 없어 커넥션마다 세션 변수로 둔다.
# 넘기면 ERROR 1205 → CONCURRENCY_CONFLICT(409)로 응답한다. 확정 트랜잭션은 수십 ms라 3초는 붐빔의 신호다.
datasource:
  mysql-jpa:
    main:
      connection-init-sql: "SET SESSION innodb_lock_wait_timeout = 3"

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

# W5 로컬 테스트 PG (plan.md 7장). base URL·callback URL은 로컬 설정에서만 온다. user-id는 과제 지정 가상 계정.
# timeout (plan.md 6장 🔧): 생성은 읽기 3s·재시도 없음, 조회는 읽기 1s·재시도 있음.
pg:
  local:
    base-url: http://localhost:8082
    user-id: "135135"
    callback-url: http://localhost:8080/api/v1/payments/callback
    connect-timeout: 1s
    create-read-timeout: 3s
    lookup-read-timeout: 1s

# W5 PG 회복 전략 (plan.md 6장 🔧). 어댑터가 레지스트리에서 이름으로 꺼내 코드로 감싼다 (LocalPgPaymentGatewayAdapter).
# TimeLimiter는 쓰지 않는다 — read-timeout이 응답 전체 시간 제한이고, 넘으면 HTTP 요청 자체를 취소한다 (plan.md 6장).
resilience4j:
  circuitbreaker:
    configs:
      pg:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 100
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: false
    instances:
      pgCreate: # 생성 전용. OPEN이면 보내기 전에 막는다 → 효과 0건 (ADR-W5-03)
        base-config: pg
        ignore-exceptions: # 업무 거절(4xx)은 PG 장애가 아니다
          - com.loopers.payment.application.port.out.PgRejectedException
      pgLookup: # 조회 전용. 생성 회로와 따로 열린다
        base-config: pg
        ignore-exceptions: # 404가 아닌 4xx는 요청·설정 문제다
          - com.loopers.payment.adapter.out.pg.PgLookupClientErrorException
  retry:
    instances:
      pgLookup: # 조회만 재시도한다. 생성은 재시도 인스턴스가 없다
        max-attempts: 3 # 1 + 재시도 2
        wait-duration: 100ms # 100ms · 200ms (×2), 각 ±50% jitter
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions: # timeout·5xx·IO·해석 불가만. 4xx·회로 OPEN은 재시도하지 않는다
          - com.loopers.payment.adapter.out.pg.PgLookupRetryableException

# W5 결제 발송 풀 (ADR-W5-01·03, plan.md 0-1 🔧): 동시 PG 대기 100 TPS × 0.5s = 50. 대기열 0 — 넘치면 늦게 보내지 않고 바로 실패로 닫는다.
# W6 (docs/week6/plan.md D-2·D-8): 주문 확정 이벤트 topic. partition 3 · RF 3 · min.insync.replicas 2.
kafka:
  topics:
    order-events: order-events
    # W8 (docs/week8/plan.md D-8): 쿠폰 발급 요청. key = userId
    coupon-issue: coupon-issue-requests

# W7 relay 한 회차 (docs/week7/plan.md D-1): 한 번에 고르는 최대 행 수 · broker 응답(ack)을 기다리는 시간.
# send-wait(35s)는 producer가 포기하는 delivery.timeout.ms(30s)보다 길어야 한다 — relay가 실패로 적은 행이 뒤늦게 성공하지 않게.
# lease(1분, OrderOutbox.LEASE)는 send-wait보다 길어야 한다 — 보내는 중인 행을 다시 고르지 않게.
outbox:
  relay:
    batch-size: 200
    send-wait: 35s
    # 4단계: 1초마다 한 회차. fixedDelay라 앞 회차가 끝나야 다음을 센다. ShedLock이 앱 여러 대 중 한 대만 돌린다.
    tick: 1s
    scheduler:
      enabled: true

# W8 당첨 기록 relay (docs/week8/plan.md D-2). W7 relay와 같은 값으로 시작한다.
coupon:
  outbox:
    relay:
      batch-size: 200
      send-wait: 35s
      tick: 1s
      scheduler:
        enabled: true

payment:
  dispatch:
    pool-size: 50
    queue-capacity: 0
  # W5 정리(1분)·reconcile(5초)·만료(1분, P-14) 스케줄러 (plan.md 5-1). test 프로필은 끄고 테스트가 서비스를 직접 부른다.
  scheduler:
    enabled: true
    close-delay: 60s
    reconcile-delay: 5s
    expire-delay: 60s

---
spring:
  config:
    activate:
      on-profile: local, test

# W7 4단계: BLOCKED 재개 진입점(POST /actuator/outbox/{eventId})은 관리 포트에서 local·test에서만 노출한다. 운영 프로필에는 없다.
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - outbox

---
spring:
  config:
    activate:
      on-profile: test

payment:
  scheduler:
    enabled: false

# 테스트는 relay를 직접 부른다 (scheduler 테스트만 켠다)
outbox:
  relay:
    scheduler:
      enabled: false

coupon:
  outbox:
    relay:
      scheduler:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false