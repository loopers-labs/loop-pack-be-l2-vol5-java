spring:
  main:
    web-application-type: none
  application:
    name: commerce-batch
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
  batch:
    job:
      name: ${job.name:NONE}
    jdbc:
      initialize-schema: never
  # 주간 랭킹 테이블(CREATE TABLE IF NOT EXISTS). 운영 DB에는 미리 만들어 두고 여기서는 실행하지 않는다.
  sql:
    init:
      mode: never
      schema-locations: classpath:schema/weekly-ranking.sql

commerce:
  ranking:
    weekly:
      chunk-size: 100

management:
  health:
    defaults:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local, test
  batch:
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false