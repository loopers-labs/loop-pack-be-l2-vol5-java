spring:
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    client-id: ${spring.application.name}
    properties:
        spring.json.add.type.headers: false # json serialize off
        request.timeout.ms: 20000
        retry.backoff.ms: 500
        auto:
          create.topics.enable: false # 이 클라이언트 항목은 broker의 자동 topic 생성을 제어하지 않음
          register.schemas: false
          offset.reset: latest
        use.latest.version: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # retries는 클라이언트 기본(사실상 무제한)에 두고 delivery.timeout.ms(기본 120초)가 실패 시점을 정한다.
      properties:
        # broker 정보를 못 얻을 때 send()가 요청 스레드를 붙잡는 최대 시간 (기본 60초)
        max.block.ms: 5000
    consumer:
      group-id: loopers-default-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual

---
spring.config.activate.on-profile: local, test

spring:
  kafka:
    bootstrap-servers:
      - localhost:19092
      - localhost:29092
      - localhost:39092
    # admin도 이 공통 bootstrap-servers를 사용한다. 별도 주소로 덮어쓰지 않는다.

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd
