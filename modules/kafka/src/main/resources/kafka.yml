spring:
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    client-id: ${spring.application.name}
    properties:
        spring.json.add.type.headers: false # json serialize off
        request.timeout.ms: 20000
        retry.backoff.ms: 500
        auto:
          create.topics.enable: false
          register.schemas: false
          offset.reset: latest
        use.latest.version: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all # 모든 in-sync replica가 받은 뒤에 성공으로 본다. 단일 broker에서는 복제 보장을 확인할 수 없다
      properties:
        enable.idempotence: true # 재시도로 같은 record가 partition에 두 번 쓰이지 않게 한다
        max.block.ms: 5000 # 메타데이터를 못 받을 때 send가 붙잡히는 상한. 업무 요청 스레드를 오래 잡지 않는다
        delivery.timeout.ms: 30000 # send 한 건의 전달 시도 전체 상한 (request.timeout.ms 이상이어야 한다)
    consumer:
      group-id: loopers-default-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false # Kafka가 읽는 ConsumerConfig.ENABLE_AUTO_COMMIT_CONFIG 값. properties 밑의 하이픈 표기는 Kafka가 읽지 않는다
    listener:
      ack-mode: manual

---
spring.config.activate.on-profile: local, test

spring:
  kafka:
    bootstrap-servers: localhost:19092 # producer·consumer·admin이 모두 이 호스트 주소를 쓴다 (컨테이너 내부 kafka:9092와 섞지 않는다)

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd
