spring:
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    client-id: ${spring.application.name}
    properties:
        spring.json.add.type.headers: false # json serialize off
        request.timeout.ms: 20000
        retry.backoff.ms: 500
        auto:
          create.topics.enable: false
          register.schemas: false
          offset.reset: latest
        use.latest.version: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all # 현재 ISR 전체의 기록 확인. 단일 broker(replica 1)에서는 복제 장애 내구성을 보장하지 않는다
      properties:
        enable.idempotence: true # 전송 재시도 중 broker 쪽 중복 기록 방지. 같은 업무를 새로 send 하는 중복은 막지 않는다
        max.block.ms: 5000 # broker 미연결 시 send() 호출 자체가 막히는 최대 시간 (기본 60s)
        delivery.timeout.ms: 30000 # 재시도 포함 최종 실패까지의 시간 (기본 120s). linger.ms + request.timeout.ms 이상
    consumer:
      group-id: loopers-default-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      enable-auto-commit: false # ConsumerConfig.ENABLE_AUTO_COMMIT_CONFIG 로 전달된다
    listener:
      ack-mode: manual

---
spring.config.activate.on-profile: local, test

spring:
  kafka:
    bootstrap-servers: localhost:19092 # producer·consumer·admin 공통. 호스트 리스너 (컨테이너 내부 kafka:9092 와 섞지 않는다)

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd
