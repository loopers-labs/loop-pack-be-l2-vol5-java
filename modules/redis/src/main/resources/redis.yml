spring:
  data:
    redis:
      repositories:
        enabled: false

datasource:
  redis:
    database: 0
    command-timeout: ${REDIS_COMMAND_TIMEOUT:100ms}
    connect-timeout: ${REDIS_CONNECT_TIMEOUT:100ms}
    reconnect-max-delay: ${REDIS_RECONNECT_MAX_DELAY:1s}
    master:
      host: ${REDIS_MASTER_HOST}
      port: ${REDIS_MASTER_PORT}
    replicas:
      - host: ${REDIS_REPLICA_1_HOST}
        port: ${REDIS_REPLICA_1_PORT}

---
spring.config.activate.on-profile: local, test

datasource:
  redis:
    master:
      host: localhost
      port: 6379
    replicas:
      - host: localhost
        port: 6380

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd