# W10 run.sh의 Tempo — 한 프로세스, 로컬 저장소 (plan.md D-12).
# commerce-api·streamer가 OTLP HTTP(4318)로 보내고, run.sh와 Grafana가 3200으로 조회한다.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318   # 2.7부터 기본이 localhost라 컨테이너 밖에서 못 보낸다 → 명시
ingester:
  max_block_duration: 5m
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
