<rect x="755.25" y="355" width="30" height="23" rx="3" fill="#edf2f8" stroke="#67788e"/>
<text x="770.25" y="372" text-anchor="middle" font-size="15" fill="#243248" font-weight="400">···</text>
<rect x="837.75" y="355" width="30" height="23" rx="3" fill="#d8f4e5" stroke="#26966a"/>
<text x="852.75" y="372" text-anchor="middle" font-size="15" fill="#243248" font-weight="400">···</text>
<rect x="920.25" y="355" width="30" height="23" rx="3" fill="#edf2f8" stroke="#67788e"/>
<text x="935.25" y="372" text-anchor="middle" font-size="15" fill="#243248" font-weight="400">···</text>
<rect x="1002.75" y="355" width="30" height="23" rx="3" fill="#edf2f8" stroke="#67788e"/>
<text x="1017.75" y="372" text-anchor="middle" font-size="15" fill="#243248" font-weight="400">···</text>
<text x="894" y="405" text-anchor="middle" font-size="25" fill="#21845d" font-weight="700">커버링 인덱스 탐색 × 21만 번</text>
<text x="894" y="440" text-anchor="middle" font-size="19" fill="#65748a" font-weight="400">삭제·브랜드 조건은 페이지 선정 전에 확인</text>
<path d="M894,461 L894,490" fill="none" stroke="#8c99ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="667" y="500" width="454" height="60" rx="10" fill="#f3f6fa" stroke="#cbd5e1"/>
<text x="894.0" y="525" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">ID·좋아요 수만 정렬 → LIMIT 20</text>
<text x="894.0" y="547" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">선택된 20개 ID를 임시 결과로 유지</text>
<path d="M894,564 L894,600" fill="none" stroke="#8c99ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="667" y="610" width="454" height="60" rx="10" fill="#e8f1ff" stroke="#86acf0"/>
<text x="894.0" y="635" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">선택된 상품 PRIMARY 탐색 × 20번</text>
<text x="894.0" y="657" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">이때 상품명·가격 등 전체 정보를 읽음</text>
<text x="894" y="732" text-anchor="middle" font-size="23" fill="#21845d" font-weight="700">큰 상품 행 조회: 21만 번 → 20번</text>
<text x="30" y="824" text-anchor="start" font-size="20" fill="#243248" font-weight="400">좋아요 집계·후보 정렬은 남음 · 좋아요 0개 상품을 채우는 흐름은 유지</text>
</g></svg>
