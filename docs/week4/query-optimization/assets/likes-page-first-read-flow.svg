<rect x="249.75" y="355" width="30" height="23" rx="3" fill="#d8f4e5" stroke="#26966a"/>
<text x="264.75" y="372" text-anchor="middle" font-size="15" fill="#243248" font-weight="400">···</text>
<rect x="332.25" y="355" width="30" height="23" rx="3" fill="#edf2f8" stroke="#67788e"/>
<text x="347.25" y="372" text-anchor="middle" font-size="15" fill="#243248" font-weight="400">···</text>
<rect x="414.75" y="355" width="30" height="23" rx="3" fill="#edf2f8" stroke="#67788e"/>
<text x="429.75" y="372" text-anchor="middle" font-size="15" fill="#243248" font-weight="400">···</text>
<text x="306" y="405" text-anchor="middle" font-size="25" fill="#c53d53" font-weight="700">상품 전체 행 조회 × 21만 번</text>
<text x="306" y="440" text-anchor="middle" font-size="19" fill="#65748a" font-weight="400">상품명·가격 등 모든 매핑 컬럼을 읽음</text>
<path d="M306,461 L306,490" fill="none" stroke="#8c99ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="79" y="500" width="454" height="60" rx="10" fill="#f3f6fa" stroke="#cbd5e1"/>
<text x="306.0" y="525" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">삭제·브랜드 확인 후 좋아요순 정렬</text>
<text x="306.0" y="547" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">후보 21만 개 → LIMIT 20</text>
<path d="M306,564 L306,600" fill="none" stroke="#8c99ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="79" y="610" width="454" height="60" rx="10" fill="#e8f1ff" stroke="#86acf0"/>
<text x="306.0" y="635" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">상품 20개 반환</text>
<text x="306.0" y="657" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">동점: 상품 ID 오름차순</text>
<text x="306" y="732" text-anchor="middle" font-size="22" fill="#c53d53" font-weight="700">페이지 선택 전에 큰 상품 행을 읽음</text>
<text x="894" y="220" text-anchor="middle" font-size="21" fill="#243248" font-weight="700">인덱스 (deleted_at, id, brand_id)</text>
