<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title"><title id="title">페이지 선정 후 상품 전체 정보 조회</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8c99ab"/></marker></defs><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect x="0" y="0" width="1200" height="880" rx="0" fill="#f8fafc" stroke="#f8fafc"/>
<text x="30" y="48" text-anchor="start" font-size="32" fill="#243248" font-weight="750">상품 전체 정보는 최종 20개만 읽기</text>
<text x="30" y="80" text-anchor="start" font-size="20" fill="#65748a" font-weight="400">공통: 좋아요 인덱스 69만 행 → 상품별 집계 21만 행</text>
<rect x="24" y="110" width="564" height="675" rx="10" fill="#fff" stroke="#dbe2eb"/>
<rect x="25" y="111" width="562" height="72" rx="10" fill="#fce7eb" stroke="#fce7eb"/>
<text x="306" y="156" text-anchor="middle" font-size="25" fill="#243248" font-weight="750">변경 전: 상품 행을 먼저 읽기</text>
<rect x="612" y="110" width="564" height="675" rx="10" fill="#fff" stroke="#dbe2eb"/>
<rect x="613" y="111" width="562" height="72" rx="10" fill="#dff5e9" stroke="#dff5e9"/>
<text x="894" y="156" text-anchor="middle" font-size="25" fill="#243248" font-weight="750">변경 후: 작은 인덱스로 페이지 선정</text>
<text x="306" y="220" text-anchor="middle" font-size="21" fill="#243248" font-weight="700">상품 PRIMARY (id)</text>
<path d="M306,263 L223.5,296" fill="none" stroke="#25976b" stroke-width="2"/>
