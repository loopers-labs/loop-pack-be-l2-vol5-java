<text x="780" y="524" text-anchor="middle" font-size="23" fill="#21845d" font-weight="700">해당 상품만 PK 탐색 × 21만 번</text>
<text x="780" y="552" text-anchor="middle" font-size="18" fill="#65748a" font-weight="400">삭제 여부·브랜드 조건 확인</text>
