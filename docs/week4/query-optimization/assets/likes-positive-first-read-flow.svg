<text x="268" y="799" text-anchor="middle" font-size="27" fill="#b1324c" font-weight="700">목록 SQL 2.680초</text>
<text x="268" y="840" text-anchor="middle" font-size="23" fill="#243248" font-weight="650">API 평균 2.595초</text>
<rect x="585" y="222" width="390" height="60" rx="10" fill="#f3f6fa" stroke="#cbd5e1"/>
<text x="780.0" y="247" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">좋아요 인덱스 (product_id) 순서로 읽기</text>
<text x="780.0" y="269" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">69만 행 → 상품별 집계 21만 행</text>
