<text x="1292.0" y="247" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">해당 페이지의 좋아요 있는 상품</text>
<text x="1292.0" y="269" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">20개 미만일 때만 추가 조회</text>
