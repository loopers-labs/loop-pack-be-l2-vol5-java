<text x="1292" y="527" text-anchor="middle" font-size="18" fill="#243248" font-weight="650">삭제·브랜드 조건 + 좋아요 NOT EXISTS</text>
<text x="1292" y="554" text-anchor="middle" font-size="19" fill="#21845d" font-weight="700">ID순으로 필요한 0개 상품을 조회</text>
<path d="M1292,569 L1292,596" fill="none" stroke="#8c99ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1097" y="604" width="390" height="60" rx="10" fill="#f3f6fa" stroke="#cbd5e1"/>
<text x="1292.0" y="629" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">예: 좋아요 있는 12개 + 0개인 8개</text>
<text x="1292.0" y="651" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">전부 0개라면 ID순으로 20개</text>
<text x="1292" y="701" text-anchor="middle" font-size="17" fill="#65748a" font-weight="400">0개 구간 offset = max(0, 요청 offset − 양수 수)</text>
<text x="1292" y="728" text-anchor="middle" font-size="16" fill="#65748a" font-weight="400">뒤쪽 페이지는 조건에 맞는 양수 상품 수 확인</text>
<rect x="1073" y="761" width="438" height="116" rx="10" fill="#fff8e7" stroke="#ecd9ac"/>
<text x="1292" y="800" text-anchor="middle" font-size="20" fill="#243248" font-weight="650">필터·offset에 따라 더 읽을 수 있음</text>
<text x="1292" y="840" text-anchor="middle" font-size="19" fill="#65748a" font-weight="400">현재 첫 페이지에서는 실행하지 않음</text>
<rect x="24" y="924" width="1512" height="127" rx="10" fill="#eef2f8" stroke="#d9e1ec"/>
<text x="48" y="959" text-anchor="start" font-size="25" fill="#243248" font-weight="750">전체 API: 2.595초 → 1.751초 · 약 0.84초 / 33% 감소</text>
<text x="48" y="994" text-anchor="start" font-size="20" fill="#243248" font-weight="400">남은 비용: 전체 상품 수 COUNT는 100만 행 스캔 · 상품별 좋아요 수·재고 재조회도 유지</text>
<text x="48" y="1028" text-anchor="start" font-size="17" fill="#65748a" font-weight="400">API는 순차 3회 평균, 목록 SQL은 별도 EXPLAIN ANALYZE 1회 관측. 서로 합산하는 시간이 아님.</text>
</g></svg>
