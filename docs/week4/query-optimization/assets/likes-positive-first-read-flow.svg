<text x="780.0" y="629" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">좋아요 있는 21만 후보만 정렬</text>
<text x="780.0" y="651" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">좋아요 수 DESC · 상품 ID ASC</text>
<text x="780" y="708" text-anchor="middle" font-size="19" fill="#21845d" font-weight="700">상위 20개 반환 → 충분하면 여기서 끝</text>
