<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080" role="img" aria-labelledby="title desc">
<title id="title">좋아요 있는 상품 우선 조회: 변경 전후</title><desc id="desc">이전에는 상품 100만 행을 스캔했다. 변경 후 좋아요 69만 행을 21만 상품으로 집계하고 상품 PK를 21만 번 탐색한다. 페이지가 부족하면 좋아요 0개 상품을 ID순으로 채운다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8c99ab"/></marker></defs><g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect x="0" y="0" width="1560" height="1080" rx="0" fill="#f8fafc" stroke="#f8fafc"/>
<text x="32" y="48" text-anchor="start" font-size="32" fill="#243248" font-weight="750">좋아요 0개 상품을 정렬 후보에서 빼면?</text>
<text x="32" y="80" text-anchor="start" font-size="18" fill="#65748a" font-weight="400">브랜드 필터 없는 첫 페이지 · 좋아요 69만 개 · 좋아요 있는 상품 21만 개 / 없는 상품 79만 개</text>
<rect x="24" y="110" width="488" height="792" rx="14" fill="#fff" stroke="#d9e1ec"/>
<rect x="25" y="111" width="486" height="87" rx="13" fill="#fce7eb" stroke="#fce7eb"/>
<text x="44" y="149" text-anchor="start" font-size="24" fill="#243248" font-weight="750">① 변경 전: 전체 상품 기준</text>
<text x="44" y="179" text-anchor="start" font-size="17" fill="#65748a" font-weight="400">선집계 결과를 상품에 LEFT JOIN</text>
<rect x="536" y="110" width="488" height="792" rx="14" fill="#fff" stroke="#d9e1ec"/>
<rect x="537" y="111" width="486" height="87" rx="13" fill="#dff5e9" stroke="#dff5e9"/>
<text x="556" y="149" text-anchor="start" font-size="24" fill="#243248" font-weight="750">② 변경 후: 좋아요 있는 상품 기준</text>
<text x="556" y="179" text-anchor="start" font-size="17" fill="#65748a" font-weight="400">집계 결과에서 상품으로 INNER JOIN</text>
<rect x="1048" y="110" width="488" height="792" rx="14" fill="#fff" stroke="#d9e1ec"/>
<rect x="1049" y="111" width="486" height="87" rx="13" fill="#fff2d6" stroke="#fff2d6"/>
<text x="1068" y="149" text-anchor="start" font-size="24" fill="#243248" font-weight="750">③ 페이지가 부족하면</text>
<text x="1068" y="179" text-anchor="start" font-size="17" fill="#65748a" font-weight="400">좋아요 0개 상품을 이어 붙이기</text>
<text x="268" y="237" text-anchor="middle" font-size="21" fill="#243248" font-weight="700">product · PK (id)</text>
