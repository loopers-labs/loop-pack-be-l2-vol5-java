<text x="268.0" y="530" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">상품마다 좋아요 집계 결과 탐색</text>
<text x="268.0" y="552" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">100만 번 탐색 · 결과 100만 행</text>
