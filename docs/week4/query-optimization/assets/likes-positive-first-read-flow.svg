<text x="268.0" y="629" text-anchor="middle" font-size="18" fill="#243248" font-weight="600">좋아요 0개인 79만 상품까지 포함</text>
<text x="268.0" y="651" text-anchor="middle" font-size="18" fill="#243248" font-weight="400">100만 후보에서 좋아요순 상위 20개</text>
<text x="268" y="708" text-anchor="middle" font-size="17" fill="#65748a" font-weight="400">좋아요는 69만 → 21만 행 선집계</text>
