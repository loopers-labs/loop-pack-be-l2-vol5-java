rules:
  Brand:
    INV-01: 브랜드 이름은 앞뒤 공백을 뺀 1자 이상 50자 이하다.
    INV-02: 삭제되지 않은 브랜드끼리 이름이 같지 않다. 대소문자가 다르면 다른 이름이다.
    INV-03: 삭제된 브랜드에는 삭제되지 않은 상품이 연결되어 있지 않다. 재고가 0인 상품도 연결 상품이다.
    INV-04: 삭제된 브랜드의 이름은 바뀌지 않는다.
    INV-05: 삭제된 브랜드는 삭제 시점을 그대로 유지한다.

  Product:
    INV-06: 상품 이름은 앞뒤 공백을 뺀 1자 이상 100자 이하다.
    INV-07: 같은 브랜드의 삭제되지 않은 상품끼리 이름이 같지 않다. 대소문자가 다르면 다른 이름이다.
    INV-08: 상품 가격은 1원 이상 1,000,000,000원 이하다.
    INV-09: 상품은 존재하며 삭제되지 않은 브랜드에 속한다.
    INV-10: 상품의 소속 브랜드는 만든 뒤에 바뀌지 않는다.
    INV-11: 삭제된 상품의 이름·가격·재고는 바뀌지 않는다.
    INV-12: 삭제된 상품은 삭제 시점을 그대로 유지한다.
    INV-13: 새로 만든 상품의 재고는 0이다.

  Stock:
    INV-14: 재고 수량은 0 이상이다.
    INV-15: 차감 수량은 현재 재고 이하다.

  Point:
    INV-16: 포인트 잔액은 0 이상이다.
    INV-17: 충전액은 양의 정수다.
    INV-18: 충전 뒤 잔액은 기존 잔액과 충전액의 합이다.
    INV-19: 충전 뒤 잔액은 시스템이 표현할 수 있는 범위 안이다.
    INV-20: 결제액은 현재 잔액 이하다.
    INV-21: 거절된 충전 뒤 잔액은 요청 전과 같다.
    INV-22: 새 고객의 잔액은 0이다.

  Like:
    INV-23: 새로 등록하는 좋아요의 상품은 삭제되지 않은 상태다.
    INV-24: 한 고객은 한 상품에 좋아요를 하나만 갖는다.
    INV-25: 좋아요는 등록한 고객의 것이다.
    INV-26: 상품이 삭제되어도 기존 좋아요는 남는다.

  Order:
    INV-27: 주문에는 품목이 하나 이상 있다.
    INV-28: 한 주문에 상품마다 품목이 하나다. 같은 상품이 여러 번 들어오면 수량이 합산된다.
    INV-29: 주문 합계는 품목 금액의 합이다.
    INV-30: 새 주문의 상태는 DRAFT다.
    INV-31: 주문은 구매자의 것이다.
    INV-32: 주문을 생성한 뒤 재고와 잔액은 생성 전과 같다.
    INV-33: 주문에 쓰인 상품은 주문 생성 시점과 확정 시점 모두 존재하며 삭제되지 않은 상태다.
    INV-34: 확정된 주문은 결제 결과를 갖는다. DRAFT 주문은 갖지 않는다.
    INV-35: 거절된 확정 뒤 주문 상태·재고·잔액은 확정 전과 같다.
    INV-36: 확정에 성공하면 재고는 품목 수량만큼, 잔액은 주문 합계만큼 줄어든다.
    INV-37: 확정된 주문은 한 번만 확정된 상태다.
    INV-38: 품목 수량이 바뀌는 주문의 상태는 DRAFT다.

  OrderItem:
    INV-39: 품목 수량은 양수다.
    INV-40: 품목은 주문을 생성한 시점의 상품 이름과 단가를 갖는다.
    INV-41: 상품이 바뀌거나 삭제되어도 품목의 값은 그대로다.
    INV-42: 품목 수량이 바뀌어도 단가는 그대로다.

  PaymentResult:
    INV-43: 결제 결과는 결제액과 결제 시점을 갖는다.
    INV-44: 결제액은 확정 시점의 주문 합계다.

  OrderStatus:
    INV-45: 주문 상태는 DRAFT에서 CONFIRMED로만 바뀐다.
