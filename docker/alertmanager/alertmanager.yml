# 알림 라우팅(10주차 4단계 4a). 라우팅 모양은 scripts/ops/check-alerting.sh의 amtool 라우팅 테스트로 고정한다.
# critical(사람을 깨움) → guide-webhook: 4b에서 근거를 붙이는 가이드 서버로 바꾼다. 지금은 가짜 수신기다.
# warning(아침 확인)    → slack: 로컬은 가짜 수신기다.
#   실제 Slack은 receivers.slack에 slack_configs를 두고 api_url_file로 비밀 파일을 읽는다.
#   Alertmanager는 설정 파일에서 환경 변수를 펼치지 않는다. 배포 환경이 SLACK_WEBHOOK_URL 환경 변수를 그 파일로 써 넣는다.
#   URL은 저장소에 넣지 않는다.
# severity가 없는 알림은 깨우지 않는 쪽(slack)으로 보낸다.
# 묶음에는 alertname·severity만 쓴다. orderId 같은 주문 열쇠는 label에 없다.
# 반복 주기는 [임시]다: critical 1h(처리 중인 사람을 계속 깨우지 않되 잊히지 않게), warning 4h(근무 시간 중 한두 번).
route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: guide-webhook
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: slack
      repeat_interval: 4h

receivers:
  - name: guide-webhook
    webhook_configs:
      - url: http://fake-receiver:8080/guide
        send_resolved: true
  - name: slack
    webhook_configs:
      - url: http://fake-receiver:8080/slack
        send_resolved: true
