services:
  grafana:
    image: grafana/grafana:13.3.2
    ports:
      - "127.0.0.1:${W10_GRAFANA_PORT:-3300}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/w10-dashboards/w10-payment-incident.json
    tmpfs:
      - /var/lib/grafana:uid=472,gid=0,mode=0750
    volumes:
      - ./grafana/provisioning/datasources/evidence.yml:/etc/grafana/provisioning/datasources/evidence.yml:ro
      - ./grafana/provisioning/dashboards/week10.yml:/etc/grafana/provisioning/dashboards/week10.yml:ro
      - ./grafana/dashboards/w10-payment-incident.json:/etc/grafana/w10-dashboards/w10-payment-incident.json:ro
