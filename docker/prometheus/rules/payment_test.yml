# payment.yml 규칙 테스트(promtool test rules). 실행: scripts/ops/check-alerting.sh
# 각 그룹은 계획의 장면 R1~R13 하나다(R9는 10주차 4b 가이드 서버 생존 감시, R10~R13은 5단계 환불 확인 대상). L1~L5는 4b 추가 결제 확정 API p99 지연이다. 수치는 payment.yml의 [임시] 값(X=0.2%, N=20, M=10m, K=5)에 맞췄다.
# 시계열은 1분 간격이다. 'a+bxn'은 a에서 시작해 1분마다 b씩 n번 더한다.
rule_files:
  - payment.yml

evaluation_interval: 1m

tests:
  # R1 새벽: 30분에 시작 약 15건, 그중 결과 모름 유입 약 3건(비율 20%), 서 있는 unknown 2건.
  # 비율은 높지만 건수가 N(20) 미만이라 깨우지 않는다.
  - name: R1 새벽 소량은 비율이 높아도 건수 미달로 critical 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_started_total{provider="pg-a"}'
        values: '0+0.5x60'
      - series: 'commerce_payment_unknown_entered_total{provider="pg-a"}'
        values: '0+0.1x60'
      - series: 'commerce_payment_unresolved{status="unknown"}'
        values: '2x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []
      - eval_time: 60m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []

  # R2 피크: 30분에 시작 약 1만 건, 결과 모름 유입 약 60건(0.6%), unknown이 1분에 1건씩 늘어 50건을 넘는다.
  # unknown이 20이 되는 20분부터 조건이 참이고 10분 지속한 30분부터 울린다.
  - name: R2 피크에 유입 비율과 건수가 넘고 계속 늘면 critical 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_started_total{provider="pg-a"}'
        values: '0+333x60'
      - series: 'commerce_payment_unknown_entered_total{provider="pg-a"}'
        values: '0+2x60'
      - series: 'commerce_payment_unresolved{status="unknown"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []
      - eval_time: 50m
        alertname: PaymentUnresolvedPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: &piling_annotations
              summary: 결과 모름 결제가 새로 계속 생기고 20건 이상 쌓였습니다. 자동 재조회로 풀리지 않고 있습니다.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentunresolvedpiling
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # R3 잠깐 튐: 10분부터 5분 동안 unknown이 30까지 올랐다가 자동 재조회로 0이 된다.
  # 유입 비율(30/1만 = 0.3%)은 X를 넘지만 건수 조건이 M(10분)만큼 지속되지 않아 안 울린다.
  - name: R3 잠깐 튀었다가 자동 재조회로 0이 되면 critical 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_started_total{provider="pg-a"}'
        values: '0+333x60'
      - series: 'commerce_payment_unknown_entered_total{provider="pg-a"}'
        values: '0x9 6 12 18 24 30 30x45'
      - series: 'commerce_payment_unresolved{status="unknown"}'
        values: '0x9 6 12 18 24 30 15 0x44'
    alert_rule_test:
      - eval_time: 14m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []
      - eval_time: 20m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []

  # R2b 피크 평소: unknown 25건이 서 있지만 유입은 30분에 약 9건(0.09%)으로 X 아래다.
  # 자동 재조회가 따라잡는 정상 범위라 깨우지 않는다. 건수만으로는 울리지 않는다는 것을 고정한다.
  - name: R2b 건수는 넘어도 유입 비율이 X 아래면 critical 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_started_total{provider="pg-a"}'
        values: '0+333x60'
      - series: 'commerce_payment_unknown_entered_total{provider="pg-a"}'
        values: '0+0.3x60'
      - series: 'commerce_payment_unresolved{status="unknown"}'
        values: '25x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []
      - eval_time: 60m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []

  # R4 정체(새 정의): unknown 50건이 서 있지만 30분 넘게 새 유입이 없다.
  # 새 유입이 없으면 자동 재조회·만료가 남은 건을 처리하는 중이라 깨우지 않는다. 만료가 쌓이면 PaymentAbandonedPiling이 잡는다.
  - name: R4 새 유입 없이 unknown만 남아 있으면 critical 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_started_total{provider="pg-a"}'
        values: '0+333x60'
      - series: 'commerce_payment_unknown_entered_total{provider="pg-a"}'
        values: '50x60'
      - series: 'commerce_payment_unresolved{status="unknown"}'
        values: '50x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []
      - eval_time: 60m
        alertname: PaymentUnresolvedPiling
        exp_alerts: []

  # R5 needs_review 1건이 20분 남음 → 15분 지속 뒤 warning.
  - name: R5a needs_review가 15분 넘게 남으면 warning 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_unresolved{status="needs_review"}'
        values: '0x5 1x20 0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentNeedsReview
        exp_alerts: []
      - eval_time: 24m
        alertname: PaymentNeedsReview
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 사람 확인이 필요한 결제가 15분 넘게 남아 있습니다.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentneedsreview
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # R5 needs_review 1건이 10분만 남았다가 사람이 처리해 0 → 안 울림.
  - name: R5b needs_review가 10분만 남으면 warning 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_unresolved{status="needs_review"}'
        values: '0x5 1x10 0x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: PaymentNeedsReview
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentNeedsReview
        exp_alerts: []

  # R6 거절 급증: 10분부터 failed가 confirmed와 같은 속도(1분 10건)로 늘어 비율 50%. not_sent는 0.
  # DeclineSurge만 울리고 PG 연결 규칙은 울리지 않는다.
  - name: R6a failed 급증은 DeclineSurge만 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="confirmed"}'
        values: '0+10x40'
      - series: 'commerce_payment_outcome_total{result="failed"}'
        values: '0x10 0+10x30'
      - series: 'commerce_payment_outcome_total{result="not_sent"}'
        values: '0x40'
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentDeclineSurge
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 결제 거절(failed) 종결이 급증했습니다. 카드사·PG 판정을 확인하세요.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentdeclinesurge
              dashboard_url: http://localhost:3000/d/commerce-payment-incident
      - eval_time: 30m
        alertname: PaymentPgUnreachable
        exp_alerts: []

  # R6 PG 연결 문제: 10분부터 not_sent가 1분 10건씩 는다(비율 50%). failed는 0.
  # PgUnreachable만 울리고 거절 규칙은 울리지 않는다.
  - name: R6b not_sent 급증은 PgUnreachable만 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="confirmed"}'
        values: '0+10x40'
      - series: 'commerce_payment_outcome_total{result="failed"}'
        values: '0x40'
      - series: 'commerce_payment_outcome_total{result="not_sent"}'
        values: '0x10 0+10x30'
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentPgUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: PG에 결제 요청을 보내지 못한 종결(not_sent)이 10분에 5건 이상입니다. PG 연결을 확인하세요.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentpgunreachable
              dashboard_url: http://localhost:3000/d/commerce-payment-incident
      - eval_time: 30m
        alertname: PaymentDeclineSurge
        exp_alerts: []

  # R6 평소 거절: 처리량이 많아 failed가 10분 10건을 넘지만 비율은 약 9%다. 거절 급증이 아니다.
  - name: R6c 처리량 많은 평소 거절 비율은 DeclineSurge 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="confirmed"}'
        values: '0+20x40'
      - series: 'commerce_payment_outcome_total{result="failed"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentDeclineSurge
        exp_alerts: []

  # R7 평평한 고원: PG가 길게 죽어 결과 모름 유입(1분 5건)과 만료(1분 5건)가 같다. unknown은 50에서 움직이지 않는다.
  # gauge 증가 조건이었다면 여기서 안 울렸다(수정 1). 유입 비율 1.5%와 건수 50으로 반드시 울리고, 만료 규칙도 함께 울린다.
  - name: R7 유입과 만료가 같아 unknown이 평평해도 critical 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_started_total{provider="pg-a"}'
        values: '0+333x40'
      - series: 'commerce_payment_unknown_entered_total{provider="pg-a"}'
        values: '0+5x40'
      - series: 'commerce_payment_unresolved{status="unknown"}'
        values: '50x40'
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentUnresolvedPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *piling_annotations
      - eval_time: 30m
        alertname: PaymentAbandonedPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: &abandoned_annotations
              summary: 결과를 확인하지 못하고 만료로 종결한 결제가 10분에 5건 이상 계속됩니다.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentabandonedpiling
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # R8 만료 누적: 1분 1건씩(10분 약 10건) 만료가 계속된다 → 10분 지속 뒤 Abandoned 울림.
  - name: R8a 만료가 10분 5건 이상 지속되면 critical 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PaymentAbandonedPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *abandoned_annotations

  # R8 만료 2건: 우연한 두 건은 깨우지 않는다.
  - name: R8b 만료가 2건뿐이면 critical 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0x10 1x10 2x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentAbandonedPiling
        exp_alerts: []
      - eval_time: 50m
        alertname: PaymentAbandonedPiling
        exp_alerts: []

  # R8 만료가 10분 약 4건씩 계속된다(K 바로 아래). 경계 아래는 울리지 않는다.
  - name: R8c 만료가 10분 4건으로 K 미만이면 critical 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0+0.4x50'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentAbandonedPiling
        exp_alerts: []
      - eval_time: 50m
        alertname: PaymentAbandonedPiling
        exp_alerts: []

  # for 고정: 아래 세 장면은 각 규칙의 조건이 막 참이 된 직후, for가 끝나기 전 시점에 아직 안 울리는 것을 본다.
  # for를 지우거나 줄이면 이 시점에 울려 실패한다. 입력은 R8a·R6a·R6b와 같다.
  # R8a 입력: 5분부터 10분 만료 5건 이상(조건 참) → for 10m이라 15분 전에는 안 울림.
  - name: R8d 만료 조건이 막 성립한 7분에는 for 10m 전이라 critical 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 7m
        alertname: PaymentAbandonedPiling
        exp_alerts: []

  # R6a 입력: 16분부터 failed 비율 30% 초과·10건 이상(조건 참) → for 5m이라 21분 전에는 안 울림.
  - name: R6d failed 급증 조건이 막 성립한 17분에는 for 5m 전이라 DeclineSurge 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="confirmed"}'
        values: '0+10x40'
      - series: 'commerce_payment_outcome_total{result="failed"}'
        values: '0x10 0+10x30'
      - series: 'commerce_payment_outcome_total{result="not_sent"}'
        values: '0x40'
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 17m
        alertname: PaymentDeclineSurge
        exp_alerts: []

  # R6b 입력: 12분부터 10분 not_sent 5건 이상(조건 참) → for 5m이라 17분 전에는 안 울림.
  - name: R6e not_sent 조건이 막 성립한 14분에는 for 5m 전이라 PgUnreachable 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_outcome_total{result="confirmed"}'
        values: '0+10x40'
      - series: 'commerce_payment_outcome_total{result="failed"}'
        values: '0x40'
      - series: 'commerce_payment_outcome_total{result="not_sent"}'
        values: '0x10 0+10x30'
      - series: 'commerce_payment_outcome_total{result="expired"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: PaymentPgUnreachable
        exp_alerts: []

  # R9 가이드 서버가 5분째 응답하지 않으면 warning. 6분부터 up=0이고 for 5m이라 11분부터 울린다.
  - name: R9 가이드 서버가 5분 넘게 down이면 GuideServerDown warning 울림
    interval: 1m
    input_series:
      - series: 'up{job="guide", instance="guide:8080"}'
        values: '1x5 0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: GuideServerDown
        exp_alerts: []
      - eval_time: 10m
        alertname: GuideServerDown
        exp_alerts: []
      - eval_time: 12m
        alertname: GuideServerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: guide
              instance: guide:8080
            exp_annotations:
              summary: critical 가이드 서버가 5분 넘게 응답하지 않습니다. critical 알림은 근거 없이 원본만 갑니다.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#guideserverdown
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # L 결제 확정 API p99 지연(PaymentApiLatencyP99High, warning). [임시] p99 > 1s AND 5분 100건 이상, 10분 지속.
  # 히스토그램은 누적 버킷이다. 버킷 경계(le)는 실제 수집 값(Micrometer 기본) 중 0.0447·0.5369·1.0737·3.2212·+Inf만 쓴다.
  # 빠른 요청은 0.0447 이하, PG read timeout 근처 요청(3s)은 1.0737 초과 3.2212 이하 버킷에 든다.

  # L1 사고: 1분 2000건(5분 1만 건). 11분부터 2%(분당 40건)가 3초 걸린다.
  # 5분 창의 느린 비율이 1%를 넘는 13분쯤부터 조건이 참이고 10분 지속한 23분쯤부터 울린다.
  - name: L1 5분 1만 건 중 2%가 3초면 p99 지연 warning 울림
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.044739241"}'
        values: '0+2000x10 21960+1960x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.536870911"}'
        values: '0+2000x10 21960+1960x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="1.073741824"}'
        values: '0+2000x10 21960+1960x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="3.22122547"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="+Inf"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_count{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS"}'
        values: '0+2000x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentApiLatencyP99High
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations: &latency_annotations
              summary: 결제 확정 API 응답 시간 p99가 1초를 넘은 채 10분 넘게 계속됩니다. PG 지연·응답 유실을 확인하세요.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentapilatencyp99high
              dashboard_url: http://localhost:3000/d/commerce-payment-incident
      - eval_time: 60m
        alertname: PaymentApiLatencyP99High
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations: *latency_annotations

  # L1b 경계: L1과 같되 느린 요청이 딱 1%(분당 20건)다. p99 순위(99%)가 빠른 버킷 누적과 같아 p99는 0.0447 안에 있다.
  # 즉 이 규칙은 "1%를 넘는" 요청이 1초를 넘을 때 울린다.
  - name: L1b 느린 요청이 딱 1%면 p99가 빠른 버킷 경계에 걸려 p99 지연 warning 안 울림
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.044739241"}'
        values: '0+2000x10 21980+1980x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.536870911"}'
        values: '0+2000x10 21980+1980x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="1.073741824"}'
        values: '0+2000x10 21980+1980x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="3.22122547"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="+Inf"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_count{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS"}'
        values: '0+2000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 60m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []

  # L2 새벽: 분당 2건(5분 10건), 그중 5분에 1건(10%)이 3초. p99는 3초 근처로 1s를 넘지만 5분 10건 < N(100)이라 거른다.
  # 건수 조건을 지우면 이 장면이 울려 실패한다.
  - name: L2 새벽 5분 10건 중 1건이 3초면 건수 미달로 p99 지연 warning 안 울림
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.044739241"}'
        values: '0+1.8x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.536870911"}'
        values: '0+1.8x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="1.073741824"}'
        values: '0+1.8x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="3.22122547"}'
        values: '0+2x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="+Inf"}'
        values: '0+2x60'
      - series: 'http_server_requests_seconds_count{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 40m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 60m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []

  # L3 잠깐 튐: 분당 2000건, 11·12분 2분만 10%(분당 200건)가 3초. 5분 창이 그 2분을 품는 약 6분만 조건이 참이다.
  # for 10m에 못 미쳐 울리지 않는다. for를 지우면 12분에 울려 실패한다.
  - name: L3 2분만 10%가 3초로 튀면 for 10m 전에 풀려 p99 지연 warning 안 울림
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.044739241"}'
        values: '0+2000x10 21800+1800x1 25600+2000x47'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.536870911"}'
        values: '0+2000x10 21800+1800x1 25600+2000x47'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="1.073741824"}'
        values: '0+2000x10 21800+1800x1 25600+2000x47'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="3.22122547"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="+Inf"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_count{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS"}'
        values: '0+2000x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 15m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 20m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []

  # L4 p50만 오름: 11분부터 모든 요청이 0.0447 초과 0.5369 이하로 느려진다. p50은 수십 ms에서 약 0.29s로 오르지만 p99는 약 0.53s다.
  # 꼬리가 아니라 전체가 느려진 것은 이 규칙 대상이 아니다(대시보드 p50 선과 다른 지표로 본다).
  - name: L4 전체가 0.5초로 느려져 p50은 올라도 p99가 1s 아래면 p99 지연 warning 안 울림
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.044739241"}'
        values: '0+2000x10 20000x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.536870911"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="1.073741824"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="3.22122547"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="+Inf"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_count{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS"}'
        values: '0+2000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 60m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []

  # L5 경로 범위: 확정은 빠르고, 대상 밖 주문 생성(/api/v1/orders)만 11분부터 10%가 3초다. uri 조건으로 거른다.
  - name: L5 대상이 아닌 주문 생성 경로만 느리면 p99 지연 warning 안 울림
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.044739241"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="0.536870911"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="1.073741824"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="3.22122547"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS", le="+Inf"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_count{uri="/api/v1/orders/{id}/confirm", method="POST", status="200", outcome="SUCCESS"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders", method="POST", status="200", outcome="SUCCESS", le="0.044739241"}'
        values: '0+2000x10 21800+1800x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders", method="POST", status="200", outcome="SUCCESS", le="0.536870911"}'
        values: '0+2000x10 21800+1800x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders", method="POST", status="200", outcome="SUCCESS", le="1.073741824"}'
        values: '0+2000x10 21800+1800x49'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders", method="POST", status="200", outcome="SUCCESS", le="3.22122547"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_bucket{uri="/api/v1/orders", method="POST", status="200", outcome="SUCCESS", le="+Inf"}'
        values: '0+2000x60'
      - series: 'http_server_requests_seconds_count{uri="/api/v1/orders", method="POST", status="200", outcome="SUCCESS"}'
        values: '0+2000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []
      - eval_time: 60m
        alertname: PaymentApiLatencyP99High
        exp_alerts: []

  # R10~R13 환불 확인 대상(10주차 5단계, 5b 두 축 모델). 지표(소문자 label, 기존 gauge 관례):
  #   commerce_payment_refund_cases{money_status} gauge, commerce_payment_refund_person_open gauge(사람 담당 중 건수),
  #   commerce_payment_refund_requested_oldest_age_seconds gauge, commerce_payment_refund_person_assigned_total{reason} counter.
  # 수치는 payment.yml의 [임시] 값(15m·600s·5m·30m·10건·증가 창 30m·10m)에 맞췄다.
  # R10 사람 담당 중: 6분부터 1건 → for 15m이라 21분부터 울린다. 20분은 for 직전이다.
  - name: R10a 사람 담당 중인 환불 대상이 15분 넘게 남으면 NeedsPerson warning 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: PaymentRefundNeedsPerson
        exp_alerts: []
      - eval_time: 20m
        alertname: PaymentRefundNeedsPerson
        exp_alerts: []
      - eval_time: 21m
        alertname: PaymentRefundNeedsPerson
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations: &refund_needs_person_annotations
              summary: 사람 담당 환불 대상이 15분 넘게 남아 있습니다. 환불 약속 기한 안에 확인하고 PG로 확인되지 않는 결론만 기록하세요.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentrefundneedsperson
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # R10 해소: 사람이 기록하거나 PG 사실로 담당이 자동 종료되어 0이 되면 풀린다(계속 울리지 않는다).
  - name: R10b 사람 담당 중 건수가 0으로 내려가면 NeedsPerson이 풀림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '0x5 1x20 0x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: PaymentRefundNeedsPerson
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations: *refund_needs_person_annotations
      - eval_time: 27m
        alertname: PaymentRefundNeedsPerson
        exp_alerts: []
      - eval_time: 40m
        alertname: PaymentRefundNeedsPerson
        exp_alerts: []

  # R10 경계: 사람 담당 0건이면 돈의 상태(청구 확인·환불 모름 등)가 많아도 울리지 않는다. 담당과 돈의 상태는 다른 축이다.
  - name: R10c 사람 담당이 0이면 청구 확인·환불 모름 건이 많아도 NeedsPerson 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '0x40'
      - series: 'commerce_payment_refund_cases{money_status="charged"}'
        values: '30x40'
      - series: 'commerce_payment_refund_cases{money_status="checking"}'
        values: '500x40'
      - series: 'commerce_payment_refund_cases{money_status="refunded"}'
        values: '40x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentRefundNeedsPerson
        exp_alerts: []

  # R11 환불 모름: 6분부터 1건 → for 30m이라 36분부터 울린다. 35분은 for 직전이다.
  - name: R11a 환불 결과 모름이 30분 넘게 남으면 RefundUnknown warning 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_cases{money_status="refund_unknown"}'
        values: '0x5 1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: PaymentRefundUnknown
        exp_alerts: []
      - eval_time: 37m
        alertname: PaymentRefundUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 환불 요청 결과를 모르는 대상이 30분 넘게 남아 있습니다. 다음 조회로 풀리지 않고 있습니다.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentrefundunknown
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # R11 잠깐 모름: 20분 동안 1건이 모름이었다가 다음 회차 조회로 환불됨이 되면(0) 울리지 않는다.
  - name: R11b 환불 모름이 20분 만에 조회로 풀리면 RefundUnknown 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_cases{money_status="refund_unknown"}'
        values: '0x5 1x20 0x30'
      - series: 'commerce_payment_refund_cases{money_status="refunded"}'
        values: '0x25 1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: PaymentRefundUnknown
        exp_alerts: []
      - eval_time: 50m
        alertname: PaymentRefundUnknown
        exp_alerts: []

  # R12 누적: 사람 담당이 1분에 1건씩 늘어난다(사유 두 가지로 나뉘어 유입). 10분에 10건(조건 참) → for 10m이라 20분부터 울린다.
  # 19분은 for 직전이다.
  - name: R12a 사람 담당이 계속 늘어 10건 이상이면 RefundPiling critical 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '0+1x40'
      - series: 'commerce_payment_refund_person_assigned_total{reason="handoff_deadline"}'
        values: '0+0.5x40'
      - series: 'commerce_payment_refund_person_assigned_total{reason="transaction_mismatch"}'
        values: '0+0.5x40'
    alert_rule_test:
      - eval_time: 19m
        alertname: PaymentRefundPiling
        exp_alerts: []
      - eval_time: 20m
        alertname: PaymentRefundPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: &refund_piling_annotations
              summary: 사람 담당으로 넘어가는 환불 대상이 계속 늘어 10건 이상 쌓였습니다. 자동 환불이 결론을 내지 못하고 있습니다.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentrefundpiling
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # R12 경계(≥10): 딱 10건이고 유입이 계속되면 울린다. 1분부터 조건 참 → 11분부터 울린다.
  - name: R12b 사람 담당이 딱 10건이고 유입이 계속되면 RefundPiling critical 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '10x40'
      - series: 'commerce_payment_refund_person_assigned_total{reason="handoff_deadline"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentRefundPiling
        exp_alerts: []
      - eval_time: 15m
        alertname: PaymentRefundPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *refund_piling_annotations

  # R12 경계 아래: 9건이면 유입이 계속돼도 깨우지 않는다(warning NeedsPerson이 아침 확인으로 남는다).
  - name: R12c 사람 담당이 9건이면 유입이 계속돼도 RefundPiling 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '9x40'
      - series: 'commerce_payment_refund_person_assigned_total{reason="handoff_deadline"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentRefundPiling
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentRefundPiling
        exp_alerts: []

  # R12 증가 없음: 50건이 사람 담당 중이어도 새 담당 이관이 없으면 깨우지 않는다(warning만).
  # 다른 결론(환불됨) 유입과 돈의 상태 gauge는 증가로 세지 않는다.
  - name: R12d 사람 담당 50건이 서 있어도 새 이관이 없으면 RefundPiling 안 울리고 NeedsPerson warning만 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '50x40'
      - series: 'commerce_payment_refund_person_assigned_total{reason="handoff_deadline"}'
        values: '50x40'
      - series: 'commerce_payment_refund_outcome_total{result="refunded", actor="system"}'
        values: '0+5x40'
      - series: 'commerce_payment_refund_cases{money_status="charged"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentRefundPiling
        exp_alerts: []
      - eval_time: 30m
        alertname: PaymentRefundNeedsPerson
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations: *refund_needs_person_annotations

  # R12 유입이 멈춤: 20분까지 1분 1건 이관(30건까지), 이후 멈춘다. 30분 증가 창이 유입을 벗어나는 50분 뒤에는 울리지 않는다.
  - name: R12e 이관 유입이 멈추고 30분 창을 벗어나면 RefundPiling이 풀림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '10+1x20 30x40'
      - series: 'commerce_payment_refund_person_assigned_total{reason="handoff_deadline"}'
        values: '10+1x20 30x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentRefundPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *refund_piling_annotations
      - eval_time: 55m
        alertname: PaymentRefundPiling
        exp_alerts: []

  # R12 사람이 처리해 줄어듦: 유입은 계속되지만 사람이 기록·자동 종료로 담당 중 건수가 10 아래로 내려가면 풀린다.
  - name: R12f 이관이 계속돼도 사람 담당 중 건수가 10 아래로 내려가면 RefundPiling이 풀림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_person_open'
        values: '20x20 5x20'
      - series: 'commerce_payment_refund_person_assigned_total{reason="refund_rejected"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentRefundPiling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *refund_piling_annotations
      - eval_time: 22m
        alertname: PaymentRefundPiling
        exp_alerts: []

  # R13 요청 정체: 환불 요청함 중 가장 오래된 경과가 6분부터 601초 → for 5m이라 11분부터 울린다. 10분은 for 직전이다.
  - name: R13a 환불 요청 경과가 600초를 넘은 채 5분 지속되면 RequestStuck warning 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_requested_oldest_age_seconds'
        values: '0x5 601x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentRefundRequestStuck
        exp_alerts: []
      - eval_time: 11m
        alertname: PaymentRefundRequestStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations: &refund_request_stuck_annotations
              summary: 환불을 요청하고 10분 넘게 결과를 받지 못한 대상이 있습니다. PG 취소 응답·조회를 확인하세요.
              runbook_url: https://github.com/loopers-labs/loop-pack-be-l2-vol5-java/blob/L2J4Dot/docs/runbook/week10.md#paymentrefundrequeststuck
              dashboard_url: http://localhost:3000/d/commerce-payment-incident

  # R13 경계(> 600): 딱 600초에 머물면 울리지 않는다.
  - name: R13b 환불 요청 경과가 딱 600초면 RequestStuck 안 울림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_requested_oldest_age_seconds'
        values: '600x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PaymentRefundRequestStuck
        exp_alerts: []

  # R13 해소: 경과가 1분에 60초씩 늘다가(11분에 660초) 요청이 결론 나면 0이 된다. 16분에 울리고 21분부터 0이라 풀린다.
  - name: R13c 환불 요청이 결론 나 경과가 0이 되면 RequestStuck이 풀림
    interval: 1m
    input_series:
      - series: 'commerce_payment_refund_requested_oldest_age_seconds'
        values: '0+60x20 0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentRefundRequestStuck
        exp_alerts: []
      - eval_time: 16m
        alertname: PaymentRefundRequestStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations: *refund_request_stuck_annotations
      - eval_time: 22m
        alertname: PaymentRefundRequestStuck
        exp_alerts: []
