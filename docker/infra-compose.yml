version: '3'

x-kafka-image: &kafka-image apache/kafka:3.8.1 # kafka-clients 3.8.1(Spring Boot 3.4.4)과 맞춘다

# 세 broker에 공통인 설정. 노드마다 다른 값(NODE_ID·광고 주소)은 각 서비스에 둔다.
x-kafka-common: &kafka-common
  CLUSTER_ID: "bG9vcGVyc3c2AGthZrYaAA" # 세 노드가 같은 클러스터임을 알리는 ID (UUID 16바이트의 base64, 22자)
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:19092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topic은 앱이 NewTopic으로 만든다
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3 # committed offset(__consumer_offsets)도 같은 내구성
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false" # 뒤처진 replica를 leader로 올려 잃느니 멈춘다 (기본값, 명시)
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=application
      - MYSQL_PASSWORD=application
      - MYSQL_DATABASE=loopers
      - MYSQL_CHARACTER_SET=utf8mb4
      - MYSQL_COLLATE=utf8mb4_general_ci
    volumes:
      - mysql-8-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d # 테스트 전용 스키마 loopers_test

  redis-master:
    image: redis:7.0
    container_name: redis-master
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    command:
      [
        "redis-server", # redis 서버 실행 명령어
        "--appendonly", "yes", # AOF (AppendOnlyFile) 영속성 기능 켜기
        "--save", "",
        "--latency-monitor-threshold", "100", # 특정 command 가 지정 시간(ms) 이상 걸리면 monitor 기록
        # 메모리 상한과 축출 정책 (W4, docs/week4/plan.md ADR-W4-05). 기본값(maxmemory 0 · noeviction)이면
        # 메모리가 찼을 때 쓰기가 실패해 목록 캐시 무효화(INCR)까지 막힌다.
        # volatile-lru: TTL이 있는 키(목록 캐시)만 오래 안 쓴 순으로 버린다. TTL 없는 세대 키는 남는다.
        "--maxmemory", "128mb",
        "--maxmemory-policy", "volatile-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis-readonly:
    image: redis:7.0
    container_name: redis-readonly
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "6380:6379"
    volumes:
      - redis_readonly_data:/data
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--replicaof", "redis-master", "6379", # replica 모드로 실행 + 서비스 명, 서비스 포트
        "--replica-read-only", "yes", # 읽기 전용으로 설정
        "--latency-monitor-threshold", "100",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 2s
      retries: 10

  # W6 (docs/week6/plan.md D-5, ADR-W6-04): broker 3대. 모두 broker·controller를 겸해 KRaft quorum 3(1대 장애까지 견딤).
  # 데이터 복제는 과반수가 아니라 RF·min.insync.replicas·acks로 정한다 — RF 3, min.insync 2, producer acks=all.
  # 단일 broker(bitnami 3.5.1)에서 바꿨으므로 처음 한 번은 `docker compose -f docker/infra-compose.yml down -v`로 옛 볼륨을 지운다.
  # 호스트 주소: localhost:19092, localhost:19093, localhost:19094 / 컨테이너 사이: kafka-1:9092, kafka-2:9092, kafka-3:9092
  kafka-1:
    image: *kafka-image
    container_name: kafka-1
    ports:
      - "19092:19092" # 호스트(앱·테스트)에서 접속하는 리스너
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:19092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-2:
    image: *kafka-image
    container_name: kafka-2
    ports:
      - "19093:19092" # 호스트(앱·테스트)에서 접속하는 리스너
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:19093
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-3:
    image: *kafka-image
    container_name: kafka-3
    ports:
      - "19094:19092" # 호스트(앱·테스트)에서 접속하는 리스너
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://localhost:19094
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "9099:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local  # kafka-ui 에서 보이는 클러스터명
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092

volumes:
  mysql-8-data:
  redis_master_data:
  redis_readonly_data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  default:
    driver: bridge