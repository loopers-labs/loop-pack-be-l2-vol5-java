apiVersion: 1

contactPoints:
  - orgId: 1
    name: payment-slack
    receivers:
      - uid: payment-slack
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: '{{ if eq .Status "firing" }}[발생]{{ else }}[해결]{{ end }} {{ .CommonLabels.source_alert }} ({{ .CommonLabels.severity }})'
          text: |-
            {{ range .Alerts }}{{ .Annotations.summary }}
            <{{ .Annotations.runbook_url }}|runbook 열기>
            {{ end }}
        disableResolveMessage: false
