apiVersion: 1

groups:
  - orgId: 1
    name: order-confirmed-outbox
    folder: Commerce
    interval: 10s
    rules:
      - uid: outbox-blocked-transition
        title: 주문 확정 이벤트 전달의 BLOCKED 전환 감지
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loopers
            model:
              datasource:
                type: prometheus
                uid: loopers
              editorMode: code
              # 증가, 새 시계열의 첫 양수, 재시작 뒤 값 변화를 감지하고 증가 없는 기존 시계열은 0으로 반환합니다.
              # 1분 전 존재 여부와 값은 5분 구간으로 확인해 한 번의 수집 실패(stale)를 새 시계열로 보지 않습니다.
              expr: (increase(outbox_blocked_transitions_total[1m]) > 0) or ((outbox_blocked_transitions_total unless max_over_time(outbox_blocked_transitions_total[5m] offset 1m)) * 1) or ((outbox_blocked_transitions_total != last_over_time(outbox_blocked_transitions_total[5m] offset 1m)) * 1) or (outbox_blocked_transitions_total * 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 주문 확정 이벤트 전달에서 BLOCKED 전환이 감지됐습니다
          description: "재시도 한도에 도달했거나 자동 재시도가 어려운 오류로 Outbox 행이 BLOCKED 상태가 됐습니다. eventId, orderId, lastError를 확인하고 원인을 해결한 뒤 같은 행을 수동 재시도하세요."
        labels:
          component: order-confirmed-outbox
          severity: critical
        notification_settings:
          receiver: Outbox Alerts
          group_by:
            - alertname
            - grafana_folder
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1h
