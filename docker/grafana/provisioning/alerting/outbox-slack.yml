apiVersion: 1

contactPoints:
  - orgId: 1
    name: Outbox Alerts
    receivers:
      - uid: outbox-slack
        type: slack
        disableResolveMessage: true
        settings:
          url: $SLACK_WEBHOOK_URI
          username: Outbox Relay
          title: '{{ if eq .Status "firing" }}[발생]{{ else }}[해결]{{ end }} {{ .CommonAnnotations.summary }}'
          text: '{{ .CommonAnnotations.description }}'
