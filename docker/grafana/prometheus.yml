global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'payment-db'
    scrape_interval: 5s
    static_configs:
      - targets: ['sql-exporter:9399']

  - job_name: 'kafka-lag'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:9308']
