global:
  scrape_interval: 5s
  evaluation_interval: 15s

# 테스트 파일(payment_test.yml)이 같은 디렉터리에 있으므로 규칙 파일을 이름으로 지정한다.
rule_files:
  - /etc/prometheus/rules/payment.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']

  # 가이드 서버 생존 감시(GuideServerDown). 가동·처리·실패 수를 낸다.
  - job_name: 'guide'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['guide:8080']
